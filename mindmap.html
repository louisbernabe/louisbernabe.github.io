<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind map (view only)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fafafa; font-family: system-ui, sans-serif; }
  canvas#c { display: block; width: 100%; height: 100%; cursor: grab; }
  #help { position: fixed; left: 10px; bottom: 10px; font-size: 12px; color: #666; background: #fffc; padding: 6px 8px; border-radius: 6px; }
  #cam { position: fixed; right: 10px; bottom: 10px; width: 240px; font-size: 12px; color: #444; background: #fffc; padding: 8px; border-radius: 8px; }
  #camBox { display: none; position: relative; width: 100%; aspect-ratio: 4 / 3; margin-bottom: 6px; background: #000; border-radius: 6px; overflow: hidden; }
  #camBox video, #camBox canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); } /* mirror like a selfie view */
  #camBtn { width: 100%; margin-bottom: 4px; }
  #tip { position: fixed; display: none; z-index: 5; max-width: 280px; padding: 8px 14px 8px 10px; font-size: 13px; color: #111;
         background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 4px 14px #0002; pointer-events: none; }
  #tip ul { margin: 0; padding-left: 18px; }
  #tip li { margin: 2px 0; }
  @media (max-width: 700px), (pointer: coarse) {
    #cam { width: 150px; padding: 6px; font-size: 11px; }
    #camLegend { display: none; }
    #help { bottom: auto; top: 10px; left: 10px; right: 10px; font-size: 11px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip"></div>

<div id="cam">
  <div id="camBox"><video id="camVideo" playsinline muted></video><canvas id="camOverlay"></canvas></div>
  <button id="camBtn">Enable camera</button>
  <label><input type="checkbox" id="gestOn" checked> gestures drive the zoom</label>
  <div id="camLegend" style="margin:4px 0;color:#777">spread thumb/index = zoom in · pinch = zoom out · move your hand outside the dashed box = move the map (left, right, up, down) · hand inside the box, relaxed = nothing</div>
  <div id="camStatus" style="white-space:pre-line">camera off</div>
</div>
<div id="help">view only · camera pinch: zoom · mouse wheel: zoom · drag background: pan · R: fit to screen</div>

<script>
"use strict";

/* ---------- 1. DATA (fixed, taken from mindmap (1).json; nothing here can be edited in the page) ---------- */
// [id, text, x, y, parent id (null = main node)]
const DATA = [
  [1,  "Physics",                    -480,    0,      null],
  [2,  "Math",                          0,    0,      null],
  [3,  "Business",                    480,    0,      null],
  [4,  "Thermal Physics",            -276, -149,      1],
  [5,  "Classical Mechanics",        -680, -149,      1],
  [6,  "Experimental Physics",       -665,  150,      1],
  [7,  "Electrodynamics",            -480, -190,      1],
  [8,  "Quantum Mechanics",        -283.46, 125,      1],
  [9,  "Relativity",                 -485, 211.54,    1],
  [10, "Calculus & Analysis",         190,    0,      2],
  [11, "Algebra (Linear, Abstract)", -190,    0,      2],
  [12, "Statistics and Probability",    0,  190,      2],
  [13, "Differential Equations",        0, -190,      2],
  [14, "Law",                         667, -153,      3],
  [15, "Accounting",                  288, -157,      3],
  [16, "Economics",                   480,  190,      3],
  [17, "Finance",                     480, -190,      3],
  [18, "Marketing",                662.54,  131,      3],
  [19, "Operations",                  290, 114.54,    3],
];
const nodes = DATA.map(([id, text, x, y, parent]) => ({ id, text, x, y, parent, w: 0, h: 0 }));
const byId = new Map(nodes.map(n => [n.id, n]));

/* ---------- 1b. HOVER LISTS: edit these ----------
   For each sub node, list the items shown in the dropdown when the mouse hovers it.
   The key must match the node's text exactly. Items are plain text (no HTML).
   An empty list [] means no dropdown for that node. */
const DETAILS = {
  // Physics
  "Thermal Physics": [            // EXAMPLE: replace with your own items
    "Thermodynamics I - UofM",
    "Thermodynamics II - UofM",
    "Thermal Physics - UofT",
  ],
  "Classical Mechanics": [
    "General Physics - UofM",
    "Newtonian Dynamics I - UofM", 
    "Newtonian Dynamics II - UofM",
    "Oscillator and Vibration Physics - UofM",
    "Wave Mechanics - UofM",
    "Advanced Classical Mechanics - UofM",
  ],
  "Experimental Physics": [
    "Laboratory Physics: Mechanics and Electronics - UofM",
    "Experimental Physics I, II - UofM",
    "Python Programming for Sciences - UofM",
    "Computational Physics - UofM",
    "Practical Physics II - UofM",
  ],
  "Electrodynamics": [
    "Electricity and Magnetism - UofM",
    "Electrodynamics - UofM",
    "Electronics - UofM",
  ],
  "Quantum Mechanics": [
    "Introduction to Quantum Mechanics - UofT",
    "Introduction to Quantum Mechanics - UofM",
  ],
  "Relativity": [],
  // Math
  "Calculus & Analysis": [
    "Calculus I - UofM", 
    "Calculus II - UofM", 
    "Calculus III and Analysis - UofM",
    "Mathematics - ESADE",
    "Multivariable Calculus - UofT",
  ],
  "Algebra (Linear, Abstract)": [
    "Linear Algebra I - UofM",
    "Linear Algebra II - UofM",
  ],
  "Statistics and Probability": [
    "Mathematical Problems - UofM",
    "Statistics I - ESADE",
    "Statistics II - ESADE",
  ],
  "Differential Equations": [
    "Differential Equations I (ODE)",
    "Differential Equations II (PDE)",
  ],
  // Business
  "Law": [
    "Corporate Law - ESADE",
    "Fiscal Law - ESADE",
  ],
  "Accounting": [
    "Accounting I - ESADE",
    "Accounting II - ESADE",
    "Accounting III - ESADE",
    "Intermediate Accounting - KU",
  ],
  "Economics": [
    "Microeconomics - ESADE",
    "Macroeconomics - ESADE",
    "Business Policy - ESADE",
  ],
  "Finance": [
    "Financial Markets - ESADE",
    "Corporate Finance I - ESADE",
    "Corporate Finance II - ESADE",
  ],
  "Marketing": [
    "Marketing Management I - ESADE",
    "Marketing Management II - ESADE",
    "Marketing Management III - ESADE",
  ],
  "Operations": [
    "Operations I - ESADE",
    "Operations II - ESADE",
    "Operations III - ESADE",
  ],
};

/* ---------- 2. VIEW + ACTIONS (the only things that can change: zoom and pan) ---------- */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const view = { x: 0, y: 0, scale: 1 };           // screen = view.pos + scale * world
const MIN_SCALE = 0.1, MAX_SCALE = 5;
// Phones and tablets (touch screens, narrow windows); same media query as the CSS below.
const IS_MOBILE = window.matchMedia("(max-width: 700px), (pointer: coarse)").matches;

const fontFor = n => n.parent === null ? "bold 18px system-ui, sans-serif" : "16px system-ui, sans-serif";
function measure() {
  for (const n of nodes) {
    ctx.font = fontFor(n);
    n.w = ctx.measureText(n.text).width + 24;
    n.h = n.parent === null ? 40 : 34;
  }
}

const actions = {
  pan(dx, dy) { view.x += dx; view.y += dy; },
  zoom(factor, sx, sy) {                          // keeps the point under (sx, sy) fixed
    const s = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * factor));
    const wx = (sx - view.x) / view.scale, wy = (sy - view.y) / view.scale;
    view.scale = s;
    view.x = sx - wx * s;
    view.y = sy - wy * s;
  },
  fit() {                                         // fit the whole map on screen
    measure();
    const cw = canvas.clientWidth, ch = canvas.clientHeight, pad = 40;
    const padTop = IS_MOBILE ? 70 : 40;           // on mobile the help text sits at the top, so leave room for it
    // Keep the map above the camera panel: reserve the height the panel will have once the camera is on.
    const cam = document.getElementById("cam"), camBox = document.getElementById("camBox");
    const boxH = camBox.style.display === "block" ? 0 : (cam.clientWidth - 16) * (IS_MOBILE ? 4 / 3 : 3 / 4) + 6;
    const reserve = Math.min(cam.offsetHeight + boxH + 20, ch * 0.5);
    const availH = Math.max(ch - reserve - padTop, 100);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of nodes) {
      x0 = Math.min(x0, n.x - n.w / 2); x1 = Math.max(x1, n.x + n.w / 2);
      y0 = Math.min(y0, n.y - n.h / 2); y1 = Math.max(y1, n.y + n.h / 2);
    }
    const SHRINK = 0.9;                            // a little air around the map: the clusters come out slightly smaller
    const s = Math.min((cw - 2 * pad) / (x1 - x0), availH / (y1 - y0), 1.5) * SHRINK;
    view.scale = s;
    view.x = cw / 2 - s * (x0 + x1) / 2;           // centered horizontally
    view.y = padTop - s * y0;                      // top edge of the map at the top margin
  },
};
window.actions = actions;                         // used by the camera script below

/* ---------- 3. RENDERING ---------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
}
window.addEventListener("resize", resize);

function draw() {
  updateHover();
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  ctx.transform(view.scale, 0, 0, view.scale, view.x, view.y);   // everything below is in world coordinates

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.strokeStyle = "#999";
  ctx.lineWidth = 2;
  for (const n of nodes) {
    const p = byId.get(n.parent);
    if (!p) continue;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(n.x, n.y); ctx.stroke();
  }
  for (const n of nodes) {
    const main = n.parent === null;
    ctx.fillStyle = main ? "#dbeafe" : n === hovered ? "#eff6ff" : "#fff";
    ctx.strokeStyle = main || n === hovered ? "#2563eb" : "#555";
    ctx.beginPath();
    ctx.roundRect(n.x - n.w / 2, n.y - n.h / 2, n.w, n.h, 8);
    ctx.fill(); ctx.stroke();
    ctx.font = fontFor(n);
    ctx.fillStyle = "#111";
    ctx.fillText(n.text, n.x, n.y);
  }
  requestAnimationFrame(draw);
}

/* ---------- 4. MOUSE FALLBACK (zoom and pan only; there is no way to touch the nodes) ---------- */
let panning = null;
const mousePos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
canvas.addEventListener("mousedown", e => { panning = mousePos(e); });
window.addEventListener("mousemove", e => {
  if (!panning) return;
  const m = mousePos(e);
  actions.pan(m.x - panning.x, m.y - panning.y);
  panning = m;
});
window.addEventListener("mouseup", () => { panning = null; });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const m = mousePos(e);
  actions.zoom(Math.exp(-e.deltaY * 0.001), m.x, m.y);
}, { passive: false });
window.addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") actions.fit(); });

/* ---------- 4b. HOVER DROPDOWN (sub nodes only) ---------- */
const tip = document.getElementById("tip");
const mouse = { x: 0, y: 0, inside: false };
let hovered = null;
canvas.addEventListener("mousemove", e => { const m = mousePos(e); mouse.x = m.x; mouse.y = m.y; mouse.inside = true; });
canvas.addEventListener("mouseleave", () => { mouse.inside = false; });

// Runs every frame, so the hover stays correct even when the map moves under a still mouse (camera zoom or pan).
function updateHover() {
  let hit = null;
  if (mouse.inside && !panning) {
    const wx = (mouse.x - view.x) / view.scale, wy = (mouse.y - view.y) / view.scale;
    for (let i = nodes.length - 1; i >= 0 && !hit; i--) {
      const n = nodes[i];
      if (n.parent !== null && Math.abs(wx - n.x) <= n.w / 2 && Math.abs(wy - n.y) <= n.h / 2) hit = n;
    }
  }
  hovered = hit;

  const items = hit ? (DETAILS[hit.text] || []) : [];
  if (!items.length) { tip.style.display = "none"; tip.dataset.node = ""; return; }

  if (tip.dataset.node !== String(hit.id)) {       // rebuild the list only when the hovered node changes
    const ul = document.createElement("ul");
    for (const text of items) {
      const li = document.createElement("li");
      li.textContent = text;                       // textContent: items are always shown as plain text
      ul.appendChild(li);
    }
    tip.replaceChildren(ul);
    tip.dataset.node = String(hit.id);
  }
  tip.style.display = "block";

  // Place it just under the node; flip above it if there is no room; keep it inside the window.
  const left = view.x + view.scale * (hit.x - hit.w / 2);
  const below = view.y + view.scale * (hit.y + hit.h / 2) + 6;
  const above = view.y + view.scale * (hit.y - hit.h / 2) - 6 - tip.offsetHeight;
  const top = below + tip.offsetHeight > window.innerHeight - 8 ? above : below;
  tip.style.left = Math.max(8, Math.min(left, window.innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = Math.max(8, top) + "px";
}

resize();
actions.fit();
draw();
</script>

<script type="module">
/* ---------- 5. HAND LANDMARKER: camera pinch controls the zoom ---------- */
const MP_VERSION = "latest";   // once it works, pin an exact version (e.g. "0.10.21") for reproducibility
const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

// Rate-based ("joystick") control: the relaxed pose does nothing; the further you go past a
// threshold, the faster the map zooms. Same values as the editor; tune them with the on-screen readout.
// IS_MOBILE comes from the first script: phones and tablets get a smaller neutral box below.
const G = {
  pinchLow: 0.30,        // smoothed pinch ratio below this  -> zoom out
  pinchHigh: 0.90,       // above this                        -> zoom in
  zoomGain: 3.5,         // ln(zoom) per second per unit of ratio beyond the threshold
  smooth: 0.35,          // exponential smoothing factor (higher = more responsive, more jitter)
  engageFrames: 6,       // hand must be seen this many frames in a row before it controls anything

  // Moving the map with the hand position. Also rate-based: keep your hand inside the dashed box
  // (the centre of the camera view) for no movement; the further outside it, the faster the map moves.
  pan: true,             // set to false to switch hand-position movement off
  panDir: 1,             //  1: the view moves toward your hand (hand right -> you see more of the right)
                         // -1: the opposite (the map follows your hand like a grabbed sheet)
  panDead: IS_MOBILE ? 0.10 : 0.18,  // half-size of the neutral box, as a fraction of the camera frame (0.18 = central 36%; 0.10 = central 20% on mobile)
  panGain: IS_MOBILE ? 560 : 700,    // screen px/s per unit of frame fraction beyond the box; 560 on mobile keeps the top speed at about 220 px/s
  posSmooth: 0.25,       // smoothing of the hand position (lower = steadier, slower)
};

const btn = document.getElementById("camBtn");
const box = document.getElementById("camBox");
const video = document.getElementById("camVideo");
const overlay = document.getElementById("camOverlay");
const octx = overlay.getContext("2d");
const setStatus = t => { document.getElementById("camStatus").textContent = t; };

btn.addEventListener("click", async () => {
  btn.disabled = true;
  try {
    setStatus("loading model…");
    const { FilesetResolver, HandLandmarker, DrawingUtils } = await import(`${MP_BASE}/vision_bundle.mjs`);
    const fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
    const make = delegate => HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate },
      runningMode: "VIDEO",
      numHands: 2,
    });
    let landmarker;
    try { landmarker = await make("GPU"); } catch { landmarker = await make("CPU"); }

    setStatus("starting camera…");
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: "user" }, audio: false
    });
    await video.play();
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    box.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;   // phones often give portrait video
    box.style.display = "block";
    btn.style.display = "none";

    const utils = new DrawingUtils(octx);
    const W = video.videoWidth, H = video.videoHeight;
    const mapCanvas = document.getElementById("c");
    const gestOn = document.getElementById("gestOn");
    let lastTime = -1, lastT = performance.now();
    let handFrames = 0, smPinch = 0, smX = 0.5, smY = 0.5;

    function loop() {
      if (video.currentTime !== lastTime) {          // only process genuinely new frames
        lastTime = video.currentTime;
        const now = performance.now();
        const dt = Math.min((now - lastT) / 1000, 0.1);
        lastT = now;
        const result = landmarker.detectForVideo(video, now);
        octx.clearRect(0, 0, W, H);
        if (G.pan) {                                 // dashed neutral box: hand inside = no movement
          octx.save();
          octx.strokeStyle = "#fff";
          octx.lineWidth = 2;
          octx.setLineDash([8, 8]);
          octx.strokeRect((0.5 - G.panDead) * W, (0.5 - G.panDead) * H, 2 * G.panDead * W, 2 * G.panDead * H);
          octx.restore();
        }

        if (!result.landmarks.length) {
          handFrames = 0;
          setStatus("no hand detected");
        } else {
          result.landmarks.forEach((lm, i) => {      // draw all hands; only the first one controls the zoom
            utils.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS, { color: i === 0 ? "#2563eb" : "#9ca3af", lineWidth: 3 });
            utils.drawLandmarks(lm, { color: "#fff", fillColor: i === 0 ? "#ef4444" : "#9ca3af", radius: 3 });
          });
          const lm = result.landmarks[0];
          const d = (a, b) => Math.hypot((lm[a].x - lm[b].x) * W, (lm[a].y - lm[b].y) * H);

          // Pinch: thumb tip (4) to index tip (8), divided by hand size (wrist 0 to middle knuckle 9)
          const pinch = d(4, 8) / d(0, 9);
          handFrames++;
          smPinch = handFrames === 1 ? pinch : smPinch + G.smooth * (pinch - smPinch);

          // Palm centre = average of the wrist and the four knuckles (0, 5, 9, 13, 17). It barely moves when
          // the fingers open or close, so zooming doesn't disturb it. x is mirrored: right = your right.
          const palmX = 1 - (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5;
          const palmY = (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5;
          if (handFrames === 1) { smX = palmX; smY = palmY; }
          else { smX += G.posSmooth * (palmX - smX); smY += G.posSmooth * (palmY - smY); }
          if (G.pan) {                               // palm marker (the overlay is mirrored by CSS, so use raw x)
            octx.beginPath();
            octx.arc((1 - smX) * W, smY * H, 9, 0, 2 * Math.PI);
            octx.strokeStyle = "#facc15";
            octx.lineWidth = 3;
            octx.stroke();
          }

          let zExcess = 0;                           // distance past the thresholds (0 in the neutral zone)
          if (smPinch < G.pinchLow) zExcess = smPinch - G.pinchLow;        // negative: zoom out
          else if (smPinch > G.pinchHigh) zExcess = smPinch - G.pinchHigh; // positive: zoom in

          const live = gestOn.checked && handFrames >= G.engageFrames;
          if (live && zExcess) {
            // zoom around the screen centre
            window.actions.zoom(Math.exp(G.zoomGain * zExcess * dt), mapCanvas.clientWidth / 2, mapCanvas.clientHeight / 2);
          }

          // Pan: distance of the palm beyond the neutral box (0 inside it), per axis
          const dxN = smX - 0.5, dyN = smY - 0.5;
          const ex = Math.abs(dxN) > G.panDead ? Math.sign(dxN) * (Math.abs(dxN) - G.panDead) : 0;
          const ey = Math.abs(dyN) > G.panDead ? Math.sign(dyN) * (Math.abs(dyN) - G.panDead) : 0;
          const vx = G.panDir * ex, vy = G.panDir * ey;      // direction the VIEW moves
          if (live && G.pan && (ex || ey)) {
            // the view moves toward the hand, so the content slides the opposite way
            window.actions.pan(-G.panGain * vx * dt, -G.panGain * vy * dt);
          }

          const sgn = v => (v >= 0 ? "+" : "") + v.toFixed(2);
          const arrows = (vx > 0 ? " →" : vx < 0 ? " ←" : "") + (vy > 0 ? " ↓" : vy < 0 ? " ↑" : "");
          setStatus(
            `pinch ${smPinch.toFixed(2)}${zExcess > 0 ? "  ▲ zoom in" : zExcess < 0 ? "  ▼ zoom out" : ""}\n` +
            (G.pan ? `hand ${sgn(dxN)}, ${sgn(dyN)}${arrows}` : "movement off") +
            (live ? "" : "  (paused)")
          );
        }
      }
      requestAnimationFrame(loop);
    }
    loop();
  } catch (err) {
    console.error(err);
    setStatus("error: " + (err.message || err));
    btn.disabled = false;
  }
});
</script>
</body>
</html>
