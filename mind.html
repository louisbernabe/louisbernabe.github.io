<!DOCTYPE html>
<html lang="en">

		<link rel="stylesheet" type="text/css" href="/css/bladerunner-light.css">
		<link rel="stylesheet" type="text/css" href="/css/bladerunner-topbar.css">
		<link rel="stylesheet" type="text/css" href="/css/bladerunner-contact-align.css">
		<link rel="stylesheet" type="text/css" href="/css/bladerunner-paragraphs.css">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind map (view only)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fafafa; font-family: system-ui, sans-serif; }
  canvas#c { display: block; width: 100%; height: 100%; cursor: grab; }
  #help { position: fixed; left: 10px; bottom: 10px; font-size: 12px; color: #666; background: #fffc; padding: 6px 8px; border-radius: 6px; }
  #tip { position: fixed; display: none; z-index: 5; max-width: 280px; padding: 8px 14px 8px 10px; font-size: 13px; color: #111;
         background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 4px 14px #0002; pointer-events: none; }
  #tip ul { margin: 0; padding-left: 18px; }
  #tip li { margin: 2px 0; }
  #tip strong { display: block; margin-bottom: 4px; }
  @media (max-width: 700px), (pointer: coarse) {
    #help { display: none; }   /* no help line on mobile: the map gets the whole screen */
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip"></div>

<div id="help">view only · hover a circle for its content · mouse wheel: zoom · drag background: pan · R: fit to screen</div>

<script>
"use strict";

/* ---------- 1. CONTENT: edit this part ----------
   One main node in the centre, and one circle per entry of SUBNODES placed around it, equally spaced
   (the first at the top, then clockwise). Add or remove entries and the layout adapts by itself.
   Hovering a circle shows its title and its items. Titles and items are plain text (no HTML). */
const MAIN_TITLE = "Main idea";                     // PLACEHOLDER: replace with your own
const SUBNODES = [                                   // PLACEHOLDERS: replace the titles and items with your own
  { title: "Topic 1", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 2", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 3", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 4", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 5", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 6", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 7", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 8", items: ["Item A", "Item B", "Item C"] },
];
const RADIUS = 230;        // distance from the main node to the centre of each circle (grows by itself if needed)
const CIRCLE_R = 26;       // radius of the circles

// id 0 = main node; ids 1..N = circles. Positions are set by layoutRing() below.
const nodes = [{ id: 0, title: MAIN_TITLE, items: [], x: 0, y: 0, parent: null, w: 0, h: 40 }];
SUBNODES.forEach((sub, i) => nodes.push({
  id: i + 1, title: sub.title, items: sub.items || [], x: 0, y: 0, parent: 0, r: CIRCLE_R, w: 2 * CIRCLE_R, h: 2 * CIRCLE_R,
}));
const byId = new Map(nodes.map(n => [n.id, n]));

/* ---------- 2. VIEW + ACTIONS (the only things that can change: zoom and pan) ---------- */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const view = { x: 0, y: 0, scale: 1 };           // screen = view.pos + scale * world
const MIN_SCALE = 0.1, MAX_SCALE = 5;
// Phones and tablets (touch screens, narrow windows); same media query as the CSS above.
const IS_MOBILE = window.matchMedia("(max-width: 700px), (pointer: coarse)").matches;

const MAIN_FONT = "bold 18px system-ui, sans-serif";
function measure() {                              // only the main node has a text-dependent size
  ctx.font = MAIN_FONT;
  nodes[0].w = ctx.measureText(nodes[0].title).width + 24;
}

// Equal spacing: circle i sits at angle -90° + i * 360° / N. The ring is made wider if the main node's label
// is long, or if there are so many circles that neighbours would touch.
function layoutRing() {
  measure();
  const n = nodes.length - 1;
  const R = Math.max(
    RADIUS,
    nodes[0].w / 2 + CIRCLE_R + 30,
    n > 1 ? (CIRCLE_R + 6) / Math.sin(Math.PI / n) : 0
  );
  nodes.slice(1).forEach((node, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    node.x = R * Math.cos(a);
    node.y = R * Math.sin(a);
  });
}

// Bounding box of all nodes (world coordinates).
function bounds() {
  measure();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) {
    x0 = Math.min(x0, n.x - n.w / 2); x1 = Math.max(x1, n.x + n.w / 2);
    y0 = Math.min(y0, n.y - n.h / 2); y1 = Math.max(y1, n.y + n.h / 2);
  }
  return { x0, y0, x1, y1 };
}

const actions = {
  pan(dx, dy) { view.x += dx; view.y += dy; },
  zoom(factor, sx, sy) {                          // keeps the point under (sx, sy) fixed
    const s = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * factor));
    const wx = (sx - view.x) / view.scale, wy = (sy - view.y) / view.scale;
    view.scale = s;
    view.x = sx - wx * s;
    view.y = sy - wy * s;
  },
  fit() {                                         // fit the whole map on screen, centred
    const b = bounds();
    const mapW = b.x1 - b.x0, mapH = b.y1 - b.y0;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const pad = IS_MOBILE ? 10 : 40;
    const SHRINK = IS_MOBILE ? 1 : 0.9;            // desktop: a little air around the map
    const s = Math.max(Math.min((cw - 2 * pad) / mapW, (ch - 2 * pad) / mapH, 1.25), 0.05) * SHRINK;
    view.scale = s;
    view.x = cw / 2 - s * (b.x0 + b.x1) / 2;
    view.y = ch / 2 - s * (b.y0 + b.y1) / 2;
  },
};

/* ---------- 3. RENDERING ---------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
}
// Make the canvas exactly as tall as the space left in the window (below anything placed above it, if you add
// a topbar again), so its bottom part is never cut off and the fit sees the real available height.
function layoutCanvas() {
  const top = Math.max(0, canvas.getBoundingClientRect().top);
  canvas.style.height = Math.max(100, window.innerHeight - top) + "px";
  resize();
}
window.addEventListener("resize", () => { layoutCanvas(); if (IS_MOBILE) actions.fit(); });

function draw() {
  updateHover();
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  ctx.transform(view.scale, 0, 0, view.scale, view.x, view.y);   // everything below is in world coordinates

  // links (drawn first, so the nodes cover their ends)
  ctx.strokeStyle = "#999";
  ctx.lineWidth = 2;
  for (const n of nodes) {
    const p = byId.get(n.parent);
    if (!p) continue;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(n.x, n.y); ctx.stroke();
  }

  // circles
  for (const n of nodes) {
    if (n.parent === null) continue;
    const hot = n === hovered;
    ctx.fillStyle = hot ? "#dbeafe" : "#fff";
    ctx.strokeStyle = hot ? "#2563eb" : "#555";
    ctx.lineWidth = hot ? 3 : 2;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  }

  // main node
  const m = nodes[0];
  ctx.fillStyle = "#dbeafe";
  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(m.x - m.w / 2, m.y - m.h / 2, m.w, m.h, 10); ctx.fill(); ctx.stroke();
  ctx.font = MAIN_FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#111";
  ctx.fillText(m.title, m.x, m.y);

  requestAnimationFrame(draw);
}

/* ---------- 4. MOUSE FALLBACK (zoom and pan only; there is no way to touch the nodes) ---------- */
let panning = null;
const mousePos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
canvas.addEventListener("mousedown", e => { panning = mousePos(e); });
window.addEventListener("mousemove", e => {
  if (!panning) return;
  const m = mousePos(e);
  actions.pan(m.x - panning.x, m.y - panning.y);
  panning = m;
});
window.addEventListener("mouseup", () => { panning = null; });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const m = mousePos(e);
  actions.zoom(Math.exp(-e.deltaY * 0.001), m.x, m.y);
}, { passive: false });
window.addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") actions.fit(); });

/* ---------- 4b. HOVER: a circle reveals its content ---------- */
const tip = document.getElementById("tip");
const mouse = { x: 0, y: 0, inside: false };
let hovered = null;
canvas.addEventListener("mousemove", e => { const m = mousePos(e); mouse.x = m.x; mouse.y = m.y; mouse.inside = true; });
canvas.addEventListener("mouseleave", () => { mouse.inside = false; });
// Touch screens have no hover: tapping a circle reveals its content, tapping elsewhere hides it.
canvas.addEventListener("touchstart", e => {
  const t = e.touches[0], r = canvas.getBoundingClientRect();
  mouse.x = t.clientX - r.left; mouse.y = t.clientY - r.top; mouse.inside = true;
}, { passive: true });

// Runs every frame, so the hover stays correct even when the map moves under a still mouse (wheel zoom or pan).
function updateHover() {
  let hit = null;
  if (mouse.inside && !panning) {
    const wx = (mouse.x - view.x) / view.scale, wy = (mouse.y - view.y) / view.scale;
    for (let i = nodes.length - 1; i >= 0 && !hit; i--) {
      const n = nodes[i];
      if (n.parent !== null && Math.hypot(wx - n.x, wy - n.y) <= n.r) hit = n;
    }
  }
  hovered = hit;
  if (!hit) { tip.style.display = "none"; tip.dataset.node = ""; return; }

  if (tip.dataset.node !== String(hit.id)) {       // rebuild the content only when the hovered circle changes
    const parts = [];
    const title = document.createElement("strong");
    title.textContent = hit.title;                 // textContent: everything is shown as plain text
    parts.push(title);
    if (hit.items.length) {
      const ul = document.createElement("ul");
      for (const text of hit.items) {
        const li = document.createElement("li");
        li.textContent = text;
        ul.appendChild(li);
      }
      parts.push(ul);
    }
    tip.replaceChildren(...parts);
    tip.dataset.node = String(hit.id);
  }
  tip.style.display = "block";

  // Place it just under the circle; flip above it if there is no room; keep it inside the window.
  const r = canvas.getBoundingClientRect();         // the canvas is not at the very top of the page (topbar above it)
  const left = r.left + view.x + view.scale * (hit.x - hit.r);
  const below = r.top + view.y + view.scale * (hit.y + hit.r) + 6;
  const above = r.top + view.y + view.scale * (hit.y - hit.r) - 6 - tip.offsetHeight;
  const top = below + tip.offsetHeight > window.innerHeight - 8 ? above : below;
  tip.style.left = Math.max(8, Math.min(left, window.innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = Math.max(8, top) + "px";
}

layoutRing();
layoutCanvas();
actions.fit();
draw();
</script>


</body>
</html>
