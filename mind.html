<title>Mind map (view only)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fafafa; font-family: system-ui, sans-serif; }
  canvas#c { display: block; width: 100%; height: 100%; cursor: grab; }
  #help { position: fixed; left: 10px; bottom: 10px; font-size: 12px; color: #666; background: #fffc; padding: 6px 8px; border-radius: 6px; }
  #cam { position: fixed; right: 10px; bottom: 10px; width: 240px; font-size: 12px; color: #444; background: #fffc; padding: 8px; border-radius: 8px; }
  #camBox { display: none; position: relative; width: 100%; aspect-ratio: 4 / 3; margin-bottom: 6px; background: #000; border-radius: 6px; overflow: hidden; }
  #camBox video, #camBox canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); } /* mirror like a selfie view */
  #camBtn { width: 100%; margin-bottom: 4px; }
  #tip { position: fixed; display: none; z-index: 5; max-width: 280px; padding: 8px 14px 8px 10px; font-size: 13px; color: #111;
         background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 4px 14px #0002; pointer-events: none; }
  #tip ul { margin: 0; padding-left: 18px; }
  #tip li { margin: 2px 0; }
  #tip strong { display: block; margin-bottom: 4px; }
  @media (max-width: 700px), (pointer: coarse) {
    #cam, #help { display: none; }   /* no camera on mobile: the map gets the whole screen */
  }
</style>
</head>
<body>
  <nav>
    		<ul class="topbar">
        		<li><a href="/">Home</a></li>

				<li><a href="/mindmap">Mind Map</a></li>
				<li><a href="/fr/" hreflang="fr" lang="fr" aria-label="Français" title="Français">FR</a></li>
    		</ul>
		</nav>
	<div class="container">
	</div>
<canvas id="c"></canvas>
<div id="tip"></div>

<script>
"use strict";

/* ---------- 1. CONTENT: edit this part ----------
   One main node in the centre, and one circle per entry of SUBNODES placed around it, equally spaced
   (the first at the top, then clockwise). Add or remove entries and the layout adapts by itself.
   Hovering a circle shows its title and its items. Titles and items are plain text (no HTML). */
const MAIN_TITLE = "Main idea";                     // PLACEHOLDER: replace with your own
const SUBNODES = [                                   // PLACEHOLDERS: replace the titles and items with your own
  { title: "Topic 1", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 2", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 3", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 4", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 5", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 6", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 7", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 8", items: ["Item A", "Item B", "Item C"] },
];
const RADIUS = 230;        // distance from the main node to the centre of each circle (grows by itself if needed)
const CIRCLE_R = 26;       // radius of the circles

// id 0 = main node; ids 1..N = circles. Positions are set by layoutRing() below.
const nodes = [{ id: 0, title: MAIN_TITLE, items: [], x: 0, y: 0, parent: null, w: 0, h: 40 }];
SUBNODES.forEach((sub, i) => nodes.push({
  id: i + 1, title: sub.title, items: sub.items || [], x: 0, y: 0, parent: 0, r: CIRCLE_R, w: 2 * CIRCLE_R, h: 2 * CIRCLE_R,
}));
const byId = new Map(nodes.map(n => [n.id, n]));

/* ---------- 2. VIEW + ACTIONS (the only things that can change: zoom and pan) ---------- */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const view = { x: 0, y: 0, scale: 1 };           // screen = view.pos + scale * world
const MIN_SCALE = 0.1, MAX_SCALE = 5;
// Phones and tablets (touch screens, narrow windows); same media query as the CSS above.
const IS_MOBILE = window.matchMedia("(max-width: 700px), (pointer: coarse)").matches;

const MAIN_FONT = "bold 18px system-ui, sans-serif";
function measure() {                              // only the main node has a text-dependent size
  ctx.font = MAIN_FONT;
  nodes[0].w = ctx.measureText(nodes[0].title).width + 24;
}

// Equal spacing: circle i sits at angle -90° + i * 360° / N. The ring is made wider if the main node's label
// is long, or if there are so many circles that neighbours would touch.
function layoutRing() {
  measure();
  const n = nodes.length - 1;
  const R = Math.max(
    RADIUS,
    nodes[0].w / 2 + CIRCLE_R + 30,
    n > 1 ? (CIRCLE_R + 6) / Math.sin(Math.PI / n) : 0
  );
  nodes.slice(1).forEach((node, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    node.x = R * Math.cos(a);
    node.y = R * Math.sin(a);
  });
}

// Bounding box of all nodes (world coordinates).
function bounds() {
  measure();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) {
    x0 = Math.min(x0, n.x - n.w / 2); x1 = Math.max(x1, n.x + n.w / 2);
    y0 = Math.min(y0, n.y - n.h / 2); y1 = Math.max(y1, n.y + n.h / 2);
  }
  return { x0, y0, x1, y1 };
}

const actions = {
  pan(dx, dy) { view.x += dx; view.y += dy; },
  zoom(factor, sx, sy) {                          // keeps the point under (sx, sy) fixed
    const s = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * factor));
    const wx = (sx - view.x) / view.scale, wy = (sy - view.y) / view.scale;
    view.scale = s;
    view.x = sx - wx * s;
    view.y = sy - wy * s;
  },
  fit() {                                         // fit the whole map on screen, centred in the free area
    const b = bounds();
    const mapW = b.x1 - b.x0, mapH = b.y1 - b.y0;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const pad = IS_MOBILE ? 10 : 40;
    // If the topbar/heading overlaps the top of the canvas (instead of sitting above it), keep the map below them.
    const canvasTop = canvas.getBoundingClientRect().top;
    const inset = Math.max(0, ...["nav", ".container"].map(sel => {
      const el = document.querySelector(sel);
      return el ? el.getBoundingClientRect().bottom - canvasTop : 0;
    }));
    const top = pad + inset;
    // Candidate free areas as [left, top, right, bottom] in canvas pixels.
    let regions;
    if (IS_MOBILE) {
      regions = [[pad, top, cw - pad, ch - 10]];                    // no camera panel on mobile
    } else {
      // The camera panel sits in the bottom-right corner. Use the area beside it (full height) or above it
      // (full width), whichever gives the bigger map.
      const cam = document.getElementById("cam"), camBox = document.getElementById("camBox");
      const previewH = camBox.style.display === "block" ? 0 : (cam.clientWidth - 16) * 3 / 4 + 6;  // preview appears with the camera
      const panelW = cam.offsetWidth + 20;                          // panel + its 10px offset + a 10px gap
      const panelH = cam.offsetHeight + previewH + 20;
      regions = [[pad, top, cw - panelW, ch - 10], [pad, top, cw - pad, ch - panelH]];
    }
    const fitIn = ([l, t, r, bt]) => Math.min((r - l) / mapW, (bt - t) / mapH);
    const region = regions.reduce((best, r) => (fitIn(r) > fitIn(best) ? r : best));
    const SHRINK = IS_MOBILE ? 1 : 0.9;            // desktop: a little air around the map
    const s = Math.max(Math.min(fitIn(region), 1.25), 0.05) * SHRINK;
    view.scale = s;
    view.x = (region[0] + region[2]) / 2 - s * (b.x0 + b.x1) / 2;   // centred in the region, both ways
    view.y = (region[1] + region[3]) / 2 - s * (b.y0 + b.y1) / 2;
  },
};
window.actions = actions;                         // used by the camera script below

/* ---------- 3. RENDERING ---------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
}
// Your topbar and heading sit above the canvas, so make the canvas exactly as tall as the space left below them.
// Otherwise its bottom part would be cut off and the fit would misjudge the available height.
function layoutCanvas() {
  const top = Math.max(0, canvas.getBoundingClientRect().top);
  canvas.style.height = Math.max(100, window.innerHeight - top) + "px";
  resize();
}
window.addEventListener("resize", () => { layoutCanvas(); if (IS_MOBILE) actions.fit(); });

function draw() {
  updateHover();
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  ctx.transform(view.scale, 0, 0, view.scale, view.x, view.y);   // everything below is in world coordinates

  // links (drawn first, so the nodes cover their ends)
  ctx.strokeStyle = "#999";
  ctx.lineWidth = 2;
  for (const n of nodes) {
    const p = byId.get(n.parent);
    if (!p) continue;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(n.x, n.y); ctx.stroke();
  }

  // circles
  for (const n of nodes) {
    if (n.parent === null) continue;
    const hot = n === hovered;
    ctx.fillStyle = hot ? "#dbeafe" : "#fff";
    ctx.strokeStyle = hot ? "#2563eb" : "#555";
    ctx.lineWidth = hot ? 3 : 2;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  }

  // main node
  const m = nodes[0];
  ctx.fillStyle = "#dbeafe";
  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(m.x - m.w / 2, m.y - m.h / 2, m.w, m.h, 10); ctx.fill(); ctx.stroke();
  ctx.font = MAIN_FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#111";
  ctx.fillText(m.title, m.x, m.y);

  requestAnimationFrame(draw);
}

/* ---------- 4. MOUSE FALLBACK (zoom and pan only; there is no way to touch the nodes) ---------- */
let panning = null;
const mousePos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
canvas.addEventListener("mousedown", e => { panning = mousePos(e); });
window.addEventListener("mousemove", e => {
  if (!panning) return;
  const m = mousePos(e);
  actions.pan(m.x - panning.x, m.y - panning.y);
  panning = m;
});
window.addEventListener("mouseup", () => { panning = null; });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const m = mousePos(e);
  actions.zoom(Math.exp(-e.deltaY * 0.001), m.x, m.y);
}, { passive: false });
window.addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") actions.fit(); });

/* ---------- 4b. HOVER: a circle reveals its content ---------- */
const tip = document.getElementById("tip");
const mouse = { x: 0, y: 0, inside: false };
let hovered = null;
canvas.addEventListener("mousemove", e => { const m = mousePos(e); mouse.x = m.x; mouse.y = m.y; mouse.inside = true; });
canvas.addEventListener("mouseleave", () => { mouse.inside = false; });
// Touch screens have no hover: tapping a circle reveals its content, tapping elsewhere hides it.
canvas.addEventListener("touchstart", e => {
  const t = e.touches[0], r = canvas.getBoundingClientRect();
  mouse.x = t.clientX - r.left; mouse.y = t.clientY - r.top; mouse.inside = true;
}, { passive: true });

// Runs every frame, so the hover stays correct even when the map moves under a still mouse (camera zoom or pan).
function updateHover() {
  let hit = null;
  if (mouse.inside && !panning) {
    const wx = (mouse.x - view.x) / view.scale, wy = (mouse.y - view.y) / view.scale;
    for (let i = nodes.length - 1; i >= 0 && !hit; i--) {
      const n = nodes[i];
      if (n.parent !== null && Math.hypot(wx - n.x, wy - n.y) <= n.r) hit = n;
    }
  }
  hovered = hit;
  if (!hit) { tip.style.display = "none"; tip.dataset.node = ""; return; }

  if (tip.dataset.node !== String(hit.id)) {       // rebuild the content only when the hovered circle changes
    const parts = [];
    const title = document.createElement("strong");
    title.textContent = hit.title;                 // textContent: everything is shown as plain text
    parts.push(title);
    if (hit.items.length) {
      const ul = document.createElement("ul");
      for (const text of hit.items) {
        const li = document.createElement("li");
        li.textContent = text;
        ul.appendChild(li);
      }
      parts.push(ul);
    }
    tip.replaceChildren(...parts);
    tip.dataset.node = String(hit.id);
  }
  tip.style.display = "block";

  // Place it just under the circle; flip above it if there is no room; keep it inside the window.
  const r = canvas.getBoundingClientRect();         // the canvas is not at the very top of the page (topbar above it)
  const left = r.left + view.x + view.scale * (hit.x - hit.r);
  const below = r.top + view.y + view.scale * (hit.y + hit.r) + 6;
  const above = r.top + view.y + view.scale * (hit.y - hit.r) - 6 - tip.offsetHeight;
  const top = below + tip.offsetHeight > window.innerHeight - 8 ? above : below;
  tip.style.left = Math.max(8, Math.min(left, window.innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = Math.max(8, top) + "px";
}

layoutRing();
layoutCanvas();
actions.fit();
draw();
</script>

<script type="module">
/* ---------- 5. HAND LANDMARKER: camera pinch controls the zoom ---------- */
const MP_VERSION = "latest";   // once it works, pin an exact version (e.g. "0.10.21") for reproducibility
const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

// Rate-based ("joystick") control: the relaxed pose does nothing; the further you go past a
// threshold, the faster the map zooms. Same values as the editor; tune them with the on-screen readout.
// IS_MOBILE comes from the first script: on phones and tablets the camera is disabled.
const G = {
  pinchLow: 0.30,        // smoothed pinch ratio below this  -> zoom out
  pinchHigh: 0.90,       // above this                        -> zoom in
  zoomGain: 3.5,         // ln(zoom) per second per unit of ratio beyond the threshold
  smooth: 0.35,          // exponential smoothing factor (higher = more responsive, more jitter)
  engageFrames: 6,       // hand must be seen this many frames in a row before it controls anything

  // Moving the map with the hand position. Also rate-based: keep your hand inside the dashed box
  // (the centre of the camera view) for no movement; the further outside it, the faster the map moves.
  pan: true,             // set to false to switch hand-position movement off
  panDir: 1,             //  1: the view moves toward your hand (hand right -> you see more of the right)
                         // -1: the opposite (the map follows your hand like a grabbed sheet)
  panDead: 0.18,         // half-size of the neutral box, as a fraction of the camera frame (0.18 = central 36%)
  panGain: 700,          // screen pixels per second per unit of frame fraction beyond the box (max about 220 px/s)
  posSmooth: 0.25,       // smoothing of the hand position (lower = steadier, slower)
};

const btn = document.getElementById("camBtn");
const box = document.getElementById("camBox");
const video = document.getElementById("camVideo");
const overlay = document.getElementById("camOverlay");
const octx = overlay.getContext("2d");
const setStatus = t => { document.getElementById("camStatus").textContent = t; };

btn.addEventListener("click", async () => {
  if (IS_MOBILE) return;                         // the camera is disabled on mobile
  btn.disabled = true;
  try {
    setStatus("loading model…");
    const { FilesetResolver, HandLandmarker, DrawingUtils } = await import(`${MP_BASE}/vision_bundle.mjs`);
    const fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
    const make = delegate => HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate },
      runningMode: "VIDEO",
      numHands: 2,
    });
    let landmarker;
    try { landmarker = await make("GPU"); } catch { landmarker = await make("CPU"); }

    setStatus("starting camera…");
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: "user" }, audio: false
    });
    await video.play();
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    box.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;   // phones often give portrait video
    box.style.display = "block";
    btn.style.display = "none";

    const utils = new DrawingUtils(octx);
    const W = video.videoWidth, H = video.videoHeight;
    const mapCanvas = document.getElementById("c");
    const gestOn = document.getElementById("gestOn");
    let lastTime = -1, lastT = performance.now();
    let handFrames = 0, smPinch = 0, smX = 0.5, smY = 0.5;

    function loop() {
      if (video.currentTime !== lastTime) {          // only process genuinely new frames
        lastTime = video.currentTime;
        const now = performance.now();
        const dt = Math.min((now - lastT) / 1000, 0.1);
        lastT = now;
        const result = landmarker.detectForVideo(video, now);
        octx.clearRect(0, 0, W, H);
        if (G.pan) {                                 // dashed neutral box: hand inside = no movement
          octx.save();
          octx.strokeStyle = "#fff";
          octx.lineWidth = 2;
          octx.setLineDash([8, 8]);
          octx.strokeRect((0.5 - G.panDead) * W, (0.5 - G.panDead) * H, 2 * G.panDead * W, 2 * G.panDead * H);
          octx.restore();
        }

        if (!result.landmarks.length) {
          handFrames = 0;
          setStatus("no hand detected");
        } else {
          result.landmarks.forEach((lm, i) => {      // draw all hands; only the first one controls the zoom
            utils.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS, { color: i === 0 ? "#2563eb" : "#9ca3af", lineWidth: 3 });
            utils.drawLandmarks(lm, { color: "#fff", fillColor: i === 0 ? "#ef4444" : "#9ca3af", radius: 3 });
          });
          const lm = result.landmarks[0];
          const d = (a, b) => Math.hypot((lm[a].x - lm[b].x) * W, (lm[a].y - lm[b].y) * H);

          // Pinch: thumb tip (4) to index tip (8), divided by hand size (wrist 0 to middle knuckle 9)
          const pinch = d(4, 8) / d(0, 9);
          handFrames++;
          smPinch = handFrames === 1 ? pinch : smPinch + G.smooth * (pinch - smPinch);

          // Palm centre = average of the wrist and the four knuckles (0, 5, 9, 13, 17). It barely moves when
          // the fingers open or close, so zooming doesn't disturb it. x is mirrored: right = your right.
          const palmX = 1 - (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5;
          const palmY = (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5;
          if (handFrames === 1) { smX = palmX; smY = palmY; }
          else { smX += G.posSmooth * (palmX - smX); smY += G.posSmooth * (palmY - smY); }
          if (G.pan) {                               // palm marker (the overlay is mirrored by CSS, so use raw x)
            octx.beginPath();
            octx.arc((1 - smX) * W, smY * H, 9, 0, 2 * Math.PI);
            octx.strokeStyle = "#facc15";
            octx.lineWidth = 3;
            octx.stroke();
          }

          let zExcess = 0;                           // distance past the thresholds (0 in the neutral zone)
          if (smPinch < G.pinchLow) zExcess = smPinch - G.pinchLow;        // negative: zoom out
          else if (smPinch > G.pinchHigh) zExcess = smPinch - G.pinchHigh; // positive: zoom in

          const live = gestOn.checked && handFrames >= G.engageFrames;
          if (live && zExcess) {
            // zoom around the screen centre
            window.actions.zoom(Math.exp(G.zoomGain * zExcess * dt), mapCanvas.clientWidth / 2, mapCanvas.clientHeight / 2);
          }

          // Pan: distance of the palm beyond the neutral box (0 inside it), per axis
          const dxN = smX - 0.5, dyN = smY - 0.5;
          const ex = Math.abs(dxN) > G.panDead ? Math.sign(dxN) * (Math.abs(dxN) - G.panDead) : 0;
          const ey = Math.abs(dyN) > G.panDead ? Math.sign(dyN) * (Math.abs(dyN) - G.panDead) : 0;
          const vx = G.panDir * ex, vy = G.panDir * ey;      // direction the VIEW moves
          if (live && G.pan && (ex || ey)) {
            // the view moves toward the hand, so the content slides the opposite way
            window.actions.pan(-G.panGain * vx * dt, -G.panGain * vy * dt);
          }

          const sgn = v => (v >= 0 ? "+" : "") + v.toFixed(2);
          const arrows = (vx > 0 ? " →" : vx < 0 ? " ←" : "") + (vy > 0 ? " ↓" : vy < 0 ? " ↑" : "");
          setStatus(
            `pinch ${smPinch.toFixed(2)}${zExcess > 0 ? "  ▲ zoom in" : zExcess < 0 ? "  ▼ zoom out" : ""}\n` +
            (G.pan ? `hand ${sgn(dxN)}, ${sgn(dyN)}${arrows}` : "movement off") +
            (live ? "" : "  (paused)")
          );
        }
      }
      requestAnimationFrame(loop);
    }
    loop();
  } catch (err) {
    console.error(err);
    setStatus("error: " + (err.message || err));
    btn.disabled = false;
  }
});
</script>
