<html lang="en">
<head>
  <link rel="stylesheet" type="text/css" href="/css/bladerunner.css">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind map (view only)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fafafa; font-family: system-ui, sans-serif; }
  :root { --tree-w: min(230px, 17vw); }              /* width of the search-path diagram on the right (0 on mobile, where it is hidden) */
  :root { --wiki-w: min(520px, 40vw); }              /* width of the Wikipedia panel on the left (0 on mobile, where it sits under the map) */
  canvas#c { display: block; margin-left: var(--wiki-w); margin-right: var(--tree-w); width: calc(100% - var(--wiki-w) - var(--tree-w)); height: 100%; cursor: grab; }
  #tip { position: fixed; display: none; z-index: 5; max-width: 280px; padding: 8px 14px 8px 10px; font-size: 13px; color: #111;
         background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 4px 14px #0002; pointer-events: none; }
  #tip ul { margin: 0; padding-left: 18px; }
  #tip li { margin: 2px 0; }
  #tip strong { display: block; margin-bottom: 4px; }
  #tip .hint { margin-top: 6px; font-size: 11px; color: #64748b; }
  #tip .kind { margin: -2px 0 4px; font-size: 11px; color: #64748b; }
  #search { position: fixed; top: 12px; left: calc(50% + (var(--wiki-w) - var(--tree-w)) / 2); transform: translateX(-50%); width: min(440px, calc(100% - var(--wiki-w) - var(--tree-w) - 24px)); z-index: 10; }
  #q { box-sizing: border-box; width: 100%; padding: 10px 16px; font: 16px system-ui, sans-serif; color: #111; background: #fff;
       border: 1px solid #cbd5e1; border-radius: 999px; box-shadow: 0 2px 8px #0001; outline: none; }
  #q:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #2563eb33; }
  #trail { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; margin-top: 6px; max-height: 60px; overflow-y: auto; font-size: 12px; color: #64748b; }
  #trail button { font: 12px system-ui, sans-serif; padding: 2px 9px; color: #111; background: #fff; border: 1px solid #cbd5e1; border-radius: 999px; cursor: pointer; }
  #trail button:hover { border-color: #2563eb; }
  #trail button.current { font-weight: 600; background: #dbeafe; border-color: #2563eb; cursor: default; }
  #qstatus { margin-top: 4px; min-height: 14px; text-align: center; font-size: 12px; color: #666; }
  /* The Wikipedia page of the main node, in a panel on the left */
  #wiki { position: fixed; left: 0; top: 0; bottom: 0; width: var(--wiki-w); box-sizing: border-box; display: flex; flex-direction: column; z-index: 4;
          background: #fff; color: #111; border-right: 1px solid #e2e8f0; font: 15px/1.55 system-ui, sans-serif; }
  #wikiHead { padding: 10px 14px; border-bottom: 1px solid #e2e8f0; }
  #wikiHead strong { display: block; font-size: 18px; }
  #wikiHead a { font-size: 12px; color: #2563eb; }
  #wikiBody { flex: 1; overflow-y: auto; padding: 8px 18px 28px; }
  #wikiBody .empty { color: #64748b; }
  #wikiBody img { max-width: 100%; height: auto; }
  #wikiBody a { color: #2563eb; text-decoration: none; }
  #wikiBody a:hover { text-decoration: underline; }
  #wikiBody table { display: block; max-width: 100%; overflow-x: auto; font-size: 13px; }
  #wikiBody .infobox, #wikiBody .thumb, #wikiBody figure { float: none !important; max-width: 100%; margin: 8px 0; }
  #wikiBody h2, #wikiBody h3, #wikiBody h4 { margin: 1.1em 0 .4em; font-family: Georgia, serif; font-weight: normal; }
  #wikiBody h2 { font-size: 1.35em; border-bottom: 1px solid #e2e8f0; }
  #wikiBody .hatnote { font-style: italic; color: #475569; }
  #wikiBody .focus { background: #fef9c3; }
  /* The search path as a diagram on the right: first search at the top, each next idea nested one step further in */
  #tree { position: fixed; right: 0; top: 0; bottom: 0; width: var(--tree-w); box-sizing: border-box; display: flex; flex-direction: column; z-index: 4;
          background: linear-gradient(#f8fafc, #eef2f7); border-left: 1px solid #e2e8f0; color: #0f172a; font: 13px/1.35 system-ui, sans-serif; }
  #treeHead { padding: 10px 14px; border-bottom: 1px solid #e2e8f0; }
  #treeHead strong { display: block; font-size: 15px; }
  #treeHead small { color: #64748b; }
  #treeLegend { display: flex; gap: 10px; margin-top: 6px; font-size: 11px; color: #475569; }
  #treeLegend .k { display: inline-block; width: 9px; height: 9px; margin-right: 4px; border-radius: 50%; border: 1.5px solid #64748b; vertical-align: -1px; }
  #treeLegend .k.page { background: #2563eb; border-color: #2563eb; }
  #treeLegend .k.section { background: #475569; }
  #treeLegend .k.word { border-style: dashed; background: #fff; }
  #treeList { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 14px 12px 28px; }
  #treeList .empty { color: #64748b; }
  #treeList .step { position: relative; margin: 18px 0 0 calc(var(--d) * 14px); }
  #treeList .step:first-child { margin-top: 0; }
  #treeList .step::before { content: ""; position: absolute; left: -7px; top: -18px; width: 7px; height: 40px;           /* the elbow from the previous card */
                            border-left: 2px solid #94a3b8; border-bottom: 2px solid #94a3b8; border-bottom-left-radius: 9px; }
  #treeList .step:first-child::before { display: none; }
  #treeList .step.flat::before { left: 7px; width: 0; height: 18px; border-bottom: 0; border-radius: 0; }   /* deepest steps stop indenting */
  #treeList .card { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 6px 10px 6px 8px;
                    background: #fff; border: 1.5px solid #cbd5e1; border-radius: 10px; box-shadow: 0 1px 2px #0f172a14; cursor: pointer; }
  #treeList .card:hover { border-color: #2563eb; }
  #treeList .card:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  #treeList .badge { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: 11px; font-weight: 600; }
  #treeList .txt { min-width: 0; }
  #treeList .txt b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; word-break: break-word; }
  #treeList .txt small { display: block; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #64748b; font-size: 11px; }
  #treeList .page .card { border-color: #2563eb; }
  #treeList .page .badge { background: #2563eb; color: #fff; }
  #treeList .section .badge { background: #475569; color: #fff; }
  #treeList .word .card { border-style: dashed; }
  #treeList .word .badge { background: #fff; border: 1.5px dashed #64748b; }
  #treeList .current .card { background: #eff6ff; border-color: #2563eb; box-shadow: 0 0 0 3px #2563eb26; cursor: default; }
  html.desktop #trail { display: none; }                             /* the diagram replaces the small buttons under the search bar */
  @media (max-width: 700px), (pointer: coarse) {
    :root { --wiki-w: 0px; --tree-w: 0px; }
    #tree { display: none; }
    html, body { height: auto; overflow: visible; }                  /* the page scrolls: the map first, the Wikipedia page right under it */
    #wiki { position: static; width: auto; height: 70vh; border-right: 0; border-top: 1px solid #e2e8f0; }
    #search { position: absolute; }                                  /* scrolls away with the map instead of covering the page */
  }
</style>
</head>
<body>
<div id="search">
  <input id="q" type="search" placeholder="Search Wikipedia, then press Enter" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Search Wikipedia">
  <div id="trail" aria-label="Ideas combined in the search"></div>
  <div id="qstatus" role="status"></div>
</div>
<canvas id="c"></canvas>
<div id="tip"></div>

<div id="wiki">
  <div id="wikiHead"><strong>Wikipedia</strong></div>
  <div id="wikiBody"><p class="empty">Search for a topic: the Wikipedia page of the main node appears here.</p></div>
</div>

<aside id="tree" aria-label="Search path">
  <div id="treeHead">
    <strong>Search path</strong>
    <small>first search at the top, latest at the bottom</small>
    <div id="treeLegend"><span><i class="k page"></i>page</span><span><i class="k section"></i>section</span><span><i class="k word"></i>word</span></div>
  </div>
  <ol id="treeList"><li class="empty">Your searches appear here, nested one inside the other.</li></ol>
</aside>
<script>
"use strict";

/* ---------- 1. CONTENT: edit this part ----------
   One main node in the centre, and one circle per entry of SUBNODES placed around it, equally spaced
   (the first at the top, then clockwise). Add or remove entries and the layout adapts by itself.
   Hovering a circle shows its title and its items. Titles and items are plain text (no HTML). */
const MAIN_TITLE = "Main idea";                     // PLACEHOLDER shown until the first search
const SUBNODES = [                                   // PLACEHOLDERS shown until the first search, which replaces them
  { title: "Topic 1", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 2", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 3", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 4", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 5", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 6", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 7", items: ["Item A", "Item B", "Item C"] },
  { title: "Topic 8", items: ["Item A", "Item B", "Item C"] },
];
const RADIUS = 230;        // distance from the main node to the centre of each circle (grows by itself if needed)
const CIRCLE_R = 26;       // radius of the circles
const RING_GAP = 14, RING_THICK = 28;   // the clickable outer ring: gap after the circles, and its thickness

// id 0 = main node; ids 1..N = circles. Positions are set by layoutRing() below.
const nodes = [{ id: 0, title: MAIN_TITLE, lines: [], items: [], x: 0, y: 0, parent: null, w: 0, h: 40 }];
SUBNODES.forEach((sub, i) => nodes.push({
  id: i + 1, title: sub.title, items: sub.items || [], x: 0, y: 0, parent: 0, r: CIRCLE_R, w: 2 * CIRCLE_R, h: 2 * CIRCLE_R,
  placeholder: true,                                // not a real word: clicking it does nothing
}));
const byId = new Map(nodes.map(n => [n.id, n]));

/* ---------- 2. VIEW + ACTIONS (the only things that can change: zoom and pan) ---------- */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const view = { x: 0, y: 0, scale: 1 };           // screen = view.pos + scale * world
const MIN_SCALE = 0.1, MAX_SCALE = 5;
// Phones and tablets (touch screens, narrow windows); same media query as the CSS above.
const IS_MOBILE = window.matchMedia("(max-width: 700px), (pointer: coarse)").matches;
document.documentElement.classList.add(IS_MOBILE ? "mobile" : "desktop");

const MAIN_FONT = "bold 18px system-ui, sans-serif";
const MAIN_MAX_W = 260, MAIN_MAX_LINES = 3, MAIN_LINE_H = 22;   // long titles wrap onto up to 3 lines

// Cuts a line with "…" until it fits in maxW.
function ellipsize(text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + "…";
}
function wrapTitle(text, maxW, maxLines = MAIN_MAX_LINES) {
  ctx.font = MAIN_FONT;
  const lines = [];
  let cur = "";
  for (const word of text.split(/\s+/).filter(Boolean)) {
    const t = cur ? cur + " " + word : word;
    if (!cur || ctx.measureText(t).width <= maxW) cur = t;
    else { lines.push(cur); cur = word; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {                  // too long: keep 3 lines and end the last one with "…"
    lines.length = maxLines;
    lines[maxLines - 1] += "…";
  }
  return lines.map(l => ellipsize(l, maxW));
}

function measure() {                              // only the main node has a text-dependent size
  const m = nodes[0];
  m.lines = wrapTitle(m.title, MAIN_MAX_W);
  ctx.font = MAIN_FONT;
  m.w = Math.max(...m.lines.map(l => ctx.measureText(l).width)) + 24;
  m.h = m.lines.length * MAIN_LINE_H + 18;
}

// Equal spacing: circle i sits at angle -90° + i * 360° / N. The ring is made wider if the main node's label
// is long, or if there are so many circles that neighbours would touch.
let ringR = 0;                                    // current radius of the ring of circles
let ringSegs = [];                                // the outer ring: one clickable segment behind each circle
let levels = [];                                  // the path so far, one entry per level: { label, page, text, topics }
function layoutRing() {
  measure();
  const n = nodes.length - 1;
  const R = ringR = Math.max(
    RADIUS,
    Math.hypot(nodes[0].w / 2, nodes[0].h / 2) + CIRCLE_R + 30,
    n > 1 ? (CIRCLE_R + 6) / Math.sin(Math.PI / n) : 0
  );
  nodes.slice(1).forEach((node, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    node.x = R * Math.cos(a);
    node.y = R * Math.sin(a);
  });

  // Outer ring: a segment behind each circle. Clicking it does the same as clicking the circle: it goes one level
  // deeper (the circle's idea joins the main node's path).
  const r1 = R + CIRCLE_R + RING_GAP, r2 = r1 + RING_THICK;
  const half = (n > 1 ? Math.PI / n : Math.PI) - 0.02;            // half the angle of a segment (a small gap between neighbours)
  const base = levels.length ? levels.map(l => l.label) : [nodes[0].title];   // the path so far
  ringSegs = nodes.slice(1).map((node, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n, mid = (r1 + r2) / 2;
    return {
      id: "ring" + i, ring: true, node, a, half, r1, r2, placeholder: !!node.placeholder,   // "placeholder" = not clickable
      x: mid * Math.cos(a), y: mid * Math.sin(a), r: RING_THICK / 2,           // anchor of the dropdown
      title: [...base, node.title].join(" › "),
      kind: "Outer ring: same as its circle",
      items: ["Goes one level deeper: this idea joins the main node"],
    };
  });
}

// Bounding box of all nodes (world coordinates).
function bounds() {
  measure();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) {
    x0 = Math.min(x0, n.x - n.w / 2); x1 = Math.max(x1, n.x + n.w / 2);
    y0 = Math.min(y0, n.y - n.h / 2); y1 = Math.max(y1, n.y + n.h / 2);
  }
  if (ringSegs.length) {                          // the outer ring is centred on the main node (the origin)
    const r2 = ringSegs[0].r2;
    x0 = Math.min(x0, -r2); x1 = Math.max(x1, r2); y0 = Math.min(y0, -r2); y1 = Math.max(y1, r2);
  }
  return { x0, y0, x1, y1 };
}

const actions = {
  pan(dx, dy) { view.x += dx; view.y += dy; },
  zoom(factor, sx, sy) {                          // keeps the point under (sx, sy) fixed
    const s = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * factor));
    const wx = (sx - view.x) / view.scale, wy = (sy - view.y) / view.scale;
    view.scale = s;
    view.x = sx - wx * s;
    view.y = sy - wy * s;
  },
  fit() {                                         // fit the whole map on screen, centred
    const b = bounds();
    const mapW = b.x1 - b.x0, mapH = b.y1 - b.y0;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const pad = IS_MOBILE ? 10 : 40;
    const bar = document.getElementById("search").getBoundingClientRect();   // the search bar with its trail and message
    const top = Math.max(76, bar.bottom - canvas.getBoundingClientRect().top + 12);   // room for it at the top
    const SHRINK = IS_MOBILE ? 1 : 0.9;            // desktop: a little air around the map
    const s = Math.max(Math.min((cw - 2 * pad) / mapW, (ch - top - pad) / mapH, 1.25), 0.05) * SHRINK;
    view.scale = s;
    view.x = cw / 2 - s * (b.x0 + b.x1) / 2;
    view.y = (top + ch - pad) / 2 - s * (b.y0 + b.y1) / 2;   // centred in the area below the search bar
  },
};

/* ---------- 3. RENDERING ---------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
}
// Desktop: the canvas is exactly as tall as the window, so nothing is cut off and the fit sees the real available height.
function layoutCanvas() {
  const canvasTop = canvas.getBoundingClientRect().top;
  let h = Math.max(100, window.innerHeight - Math.max(0, canvasTop));
  if (IS_MOBILE) {
    // Mobile: the map is only as tall as it needs; the Wikipedia page follows right under it and the page scrolls.
    const b = bounds();
    const barBottom = Math.max(76, document.getElementById("search").getBoundingClientRect().bottom - canvasTop + 12);
    h = Math.ceil(barBottom + 10 + (canvas.clientWidth - 20) * (b.y1 - b.y0) / (b.x1 - b.x0) + 10);
  }
  canvas.style.height = h + "px";
  resize();
}
window.addEventListener("resize", () => { layoutCanvas(); if (IS_MOBILE) actions.fit(); });

function draw() {
  updateHover();
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  ctx.transform(view.scale, 0, 0, view.scale, view.x, view.y);   // everything below is in world coordinates

  // outer ring (clickable): a segment behind each circle
  for (const seg of ringSegs) {
    const hot = seg === hovered;
    ctx.fillStyle = hot ? "#dbeafe" : "#f1f5f9";
    ctx.strokeStyle = hot ? "#2563eb" : "#cbd5e1";
    ctx.lineWidth = hot ? 3 : 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, seg.r2, seg.a - seg.half, seg.a + seg.half);
    ctx.arc(0, 0, seg.r1, seg.a + seg.half, seg.a - seg.half, true);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  // links (drawn first, so the nodes cover their ends)
  ctx.strokeStyle = "#999";
  ctx.lineWidth = 2;
  for (const n of nodes) {
    const p = byId.get(n.parent);
    if (!p) continue;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(n.x, n.y); ctx.stroke();
  }

  // circles
  for (const n of nodes) {
    if (n.parent === null) continue;
    const hot = n === hovered;
    ctx.fillStyle = hot ? "#dbeafe" : "#fff";
    ctx.strokeStyle = hot ? "#2563eb" : "#555";
    ctx.lineWidth = hot ? 3 : 2;
    ctx.setLineDash(n.isHeader === false ? [5, 4] : []);        // section circles solid, word circles dashed
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
  }

  // main node
  const m = nodes[0];
  ctx.fillStyle = "#dbeafe";
  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(m.x - m.w / 2, m.y - m.h / 2, m.w, m.h, 10); ctx.fill(); ctx.stroke();
  ctx.font = MAIN_FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#111";
  m.lines.forEach((line, i) => ctx.fillText(line, m.x, m.y + (i - (m.lines.length - 1) / 2) * MAIN_LINE_H));

  requestAnimationFrame(draw);
}

/* ---------- 4. MOUSE FALLBACK (zoom and pan only; there is no way to touch the nodes) ---------- */
let panning = null, dragged = 0;                    // dragged: pointer travel since the press, to tell a click from a pan
const mousePos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
canvas.addEventListener("mousedown", e => { panning = mousePos(e); dragged = 0; });
window.addEventListener("mousemove", e => {
  if (!panning) return;
  const m = mousePos(e);
  dragged += Math.abs(m.x - panning.x) + Math.abs(m.y - panning.y);
  actions.pan(m.x - panning.x, m.y - panning.y);
  panning = m;
});
window.addEventListener("mouseup", () => { panning = null; });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const m = mousePos(e);
  actions.zoom(Math.exp(-e.deltaY * 0.001), m.x, m.y);
}, { passive: false });
window.addEventListener("keydown", e => {
  if (e.target instanceof HTMLInputElement) return;            // typing in the search bar
  if (e.key === "r" || e.key === "R") actions.fit();
});

/* ---------- 4b. HOVER: a circle reveals its content ---------- */
const tip = document.getElementById("tip");
const mouse = { x: 0, y: 0, inside: false };
let hovered = null;
canvas.addEventListener("mousemove", e => { const m = mousePos(e); mouse.x = m.x; mouse.y = m.y; mouse.inside = true; });
canvas.addEventListener("mouseleave", () => { mouse.inside = false; });
// Touch screens have no hover: tapping a circle reveals its content, tapping elsewhere hides it.
let lastTouch = 0, armed = null;                  // armed: the circle whose content a first tap has revealed
canvas.addEventListener("touchstart", e => {
  const t = e.touches[0], r = canvas.getBoundingClientRect();
  mouse.x = t.clientX - r.left; mouse.y = t.clientY - r.top; mouse.inside = true;
  lastTouch = Date.now();
}, { passive: true });

// Clicking a circle (or the ring segment behind it) goes one level deeper: the idea joins the main node's path
// ("Paris › History") and new circles appear for it.
canvas.addEventListener("click", e => {
  if (dragged > 5) return;                        // that was a pan, not a click
  const m = mousePos(e), hit = targetAt(m.x, m.y);
  if (!hit || hit.placeholder) { armed = null; return; }
  if (Date.now() - lastTouch < 1000 && armed !== hit.id) { armed = hit.id; return; }   // touch: the first tap only reveals
  armed = null;
  descend(hit.ring ? hit.node : hit);
});

// The circle or outer-ring segment under a canvas pixel, or null.
function targetAt(sx, sy) {
  const wx = (sx - view.x) / view.scale, wy = (sy - view.y) / view.scale;
  for (let i = nodes.length - 1; i >= 1; i--) {
    if (Math.hypot(wx - nodes[i].x, wy - nodes[i].y) <= nodes[i].r) return nodes[i];
  }
  if (ringSegs.length) {
    const d = Math.hypot(wx, wy), angle = Math.atan2(wy, wx);
    if (d >= ringSegs[0].r1 && d <= ringSegs[0].r2) {
      for (const seg of ringSegs) {
        let diff = Math.abs(angle - seg.a) % (2 * Math.PI);
        if (diff > Math.PI) diff = 2 * Math.PI - diff;
        if (diff <= seg.half) return seg;
      }
    }
  }
  return null;
}

// Runs every frame, so the hover stays correct even when the map moves under a still mouse (wheel zoom or pan).
function updateHover() {
  const hit = mouse.inside && !panning ? targetAt(mouse.x, mouse.y) : null;
  hovered = hit;
  canvas.style.cursor = hit && !hit.placeholder ? "pointer" : "";   // "" = the stylesheet's grab cursor
  if (!hit) { tip.style.display = "none"; tip.dataset.node = ""; return; }

  if (tip.dataset.node !== String(hit.id)) {       // rebuild the content only when the hovered circle changes
    const parts = [];
    const title = document.createElement("strong");
    title.textContent = hit.title;                 // textContent: everything is shown as plain text
    parts.push(title);
    if (hit.kind) {
      const kind = document.createElement("div");
      kind.className = "kind";
      kind.textContent = hit.kind;
      parts.push(kind);
    }
    if (hit.items.length) {
      const ul = document.createElement("ul");
      for (const text of hit.items) {
        const li = document.createElement("li");
        li.textContent = text;
        ul.appendChild(li);
      }
      parts.push(ul);
    }
    if (!hit.placeholder) {
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = IS_MOBILE ? "Tap again to go one level deeper" : "Click to go one level deeper";
      parts.push(hint);
    }
    tip.replaceChildren(...parts);
    tip.dataset.node = String(hit.id);
  }
  tip.style.display = "block";

  // Place it just under the circle; flip above it if there is no room; keep it inside the window.
  const r = canvas.getBoundingClientRect();         // the canvas is not at the very top of the page (topbar above it)
  const left = r.left + view.x + view.scale * (hit.x - hit.r);
  const below = r.top + view.y + view.scale * (hit.y + hit.r) + 6;
  const above = r.top + view.y + view.scale * (hit.y - hit.r) - 6 - tip.offsetHeight;
  const top = below + tip.offsetHeight > window.innerHeight - 8 ? above : below;
  tip.style.left = Math.max(8, Math.min(left, window.innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = Math.max(8, top) + "px";
}

/* ---------- 5. WIKIPEDIA SEARCH: Enter shows the page title on the main node and its most frequent words as topics ---------- */
const WIKI_LANG = "en";                           // "fr" for the French Wikipedia, and so on
const TOPIC_COUNT = 8;                            // number of circles to fill with words
const EXCLUDE_TITLE_WORDS = true;                 // the words of the page title would always win, so they are left out; set to false to keep them
// Words too common to be topics. Only "en" and "fr" are listed: for another WIKI_LANG add a list here

  fr: `a ainsi alors après assez au aucun aussi autre autres aux avait avant avec avoir bien c ce cela celle celui ces cet

    sur ta te tes toi ton tous tout toute toutes très trois tu un une vos votre vous y`,
};
const BOILERPLATE = "retrieved archived isbn doi https http www pdf";   // leftovers of references and links

// Circles show the page's first TOPIC_COUNT section headers; if it has fewer, frequent words fill the rest.
// When headers don't fill all circles: groups of related words found by the Leiden algorithm (or plain frequent words).
const USE_LEIDEN = true;                          // false: simply the most frequent words
const CLUSTER_WORDS = 150;                        // how many of the most frequent words enter the word graph
const CLUSTER_WINDOW = 5;                         // two words are linked when at most this many words apart in a sentence
const CLUSTER_RESOLUTION = 1;                     // Leiden resolution: higher gives more, smaller groups
const HEADER_DEPTH = 1;                           // 1 = only the sections directly under the page (or under the clicked section); 2 also takes their subsections
// Headers that make poor topics (links, references...). Lower-case. Empty a list to keep them.
const SKIP_HEADERS = {
  en: ["see also", "references", "external links", "notes", "further reading", "bibliography", "sources", "citations",
       "footnotes", "notes and references", "references and notes", "works cited"],
  fr: ["voir aussi", "références", "notes et références", "liens externes", "bibliographie", "notes", "sources", "annexes"],
};

const qInput = document.getElementById("q");
const qStatus = document.getElementById("qstatus");
let searchAbort = null;

async function wikiApi(params, signal) {
  const query = new URLSearchParams({ format: "json", origin: "*", ...params });   // origin=* allows calls from any website
  const res = await fetch(`https://${WIKI_LANG}.wikipedia.org/w/api.php?${query}`, { signal });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// 1) the exact page (first letter case-insensitive, redirects followed); 2) otherwise the best full-text match.
async function findWikipediaTitle(query, signal) {
  const exact = await wikiApi({ action: "query", titles: query, redirects: "1" }, signal);
  const page = exact.query && Object.values(exact.query.pages || {})[0];
  if (page && page.missing === undefined && page.invalid === undefined) return page.title;
  const found = await wikiApi({ action: "query", list: "search", srsearch: query, srlimit: "1" }, signal);
  const hit = found.query && found.query.search && found.query.search[0];
  return hit ? hit.title : null;
}

// A Wikipedia page dedicated to "<idea> of <page>": for the page "Paris" and the idea "History", "History of Paris".
// Typical titles are tried first (one request); otherwise the best full-text result whose title names both the
// page and the idea. Pages already on the path are skipped, so every level leads somewhere new. null if none.
async function findRelatedPage(page, idea, visited, signal) {
  const clean = text => text.replace(/[|\n]/g, " ").trim();
  const p = clean(page), i = clean(idea);
  const candidates = [`${i} of ${p}`, `${p} ${i}`, `${i} (${p})`, `${i} in ${p}`];
  const data = await wikiApi({ action: "query", titles: candidates.join("|"), redirects: "1" }, signal);
  const q = data.query || {};
  const toMap = list => new Map((list || []).map(x => [x.from, x.to]));
  const normalized = toMap(q.normalized), redirects = toMap(q.redirects);
  const exists = new Set(Object.values(q.pages || {}).filter(pg => pg.missing === undefined && pg.invalid === undefined).map(pg => pg.title));
  for (const c of candidates) {
    const named = normalized.get(c) || c;
    const name = redirects.get(named) || named;
    if (exists.has(name) && !visited.has(name)) return name;
  }
  const found = await wikiApi({ action: "query", list: "search", srsearch: `${p} ${i}`, srlimit: "5" }, signal);
  const keep = makeKeep("");
  const pageWords = tokenize(p).filter(keep), ideaWords = tokenize(i).filter(keep);
  for (const hit of (found.query && found.query.search) || []) {
    const words = tokenize(hit.title);
    if (visited.has(hit.title)) continue;
    if (words.some(w => ideaWords.includes(w)) && words.some(w => pageWords.includes(w))) return hit.title;
  }
  return null;
}

// The whole page as plain text (no HTML, no infoboxes); section titles come as "== Title ==" lines.
async function fetchPlainText(title, signal) {
  const data = await wikiApi({ action: "query", prop: "extracts", explaintext: "1", exsectionformat: "wiki",
                               titles: title, redirects: "1" }, signal);
  const page = data.query && Object.values(data.query.pages || {})[0];
  return (page && page.extract) || "";
}

/* ---------- LEIDEN community detection ----------
   Traag, Waltman & van Eck, "From Louvain to Leiden: guaranteeing well-connected communities" (2019),
   with modularity as the quality function and a resolution parameter gamma (higher = more, smaller communities).
   Repeats three phases on ever coarser graphs: fast local moving of nodes, REFINEMENT of each community into
   well-connected sub-communities (what Louvain lacks), and aggregation based on the refined partition. */
function mulberry32(seed) {                       // small seeded random generator: same input, same result
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(n, rng) {                       // random order of 0..n-1
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Weighted undirected graph. self[i] = weight of the edges inside aggregate node i (counted once);
// k[i] = strength of node i = sum of its edge weights + 2 * self[i].
function leidenGraph(n, edges, self) {
  const maps = Array.from({ length: n }, () => new Map());
  for (const [a, b, w] of edges) {
    if (a === b) { self[a] += w; continue; }
    maps[a].set(b, (maps[a].get(b) || 0) + w);
    maps[b].set(a, (maps[b].get(a) || 0) + w);
  }
  const adj = maps.map(m => [...m]);              // adj[i] = [[neighbour, weight], ...]
  const k = new Float64Array(n);
  for (let i = 0; i < n; i++) { let s = 2 * self[i]; for (const [, w] of adj[i]) s += w; k[i] = s; }
  return { n, adj, self, k };
}
function relabel(part) {                          // community ids -> 0, 1, 2, ... (in place)
  const ids = new Map();
  for (let i = 0; i < part.length; i++) {
    if (!ids.has(part[i])) ids.set(part[i], ids.size);
    part[i] = ids.get(part[i]);
  }
  return part;
}

// Phase 1: move single nodes to the neighbouring community that raises modularity most, until nothing moves.
// Only the neighbours of a node that moved are looked at again (queue), which makes it fast.
function moveNodesFast(g, part, gamma, twoM, rng) {
  const n = g.n;
  const commK = new Float64Array(n), commCount = new Int32Array(n);
  for (let i = 0; i < n; i++) { commK[part[i]] += g.k[i]; commCount[part[i]]++; }
  const free = [];                                // ids of communities that became empty (may be stale: re-checked)
  const queue = shuffled(n, rng), inQueue = new Uint8Array(n).fill(1);
  for (let head = 0; head < queue.length; head++) {
    const v = queue[head];
    inQueue[v] = 0;
    const cur = part[v], kv = g.k[v];
    const wTo = new Map();                        // weight from v to each neighbouring community
    for (const [u, w] of g.adj[v]) wTo.set(part[u], (wTo.get(part[u]) || 0) + w);
    commK[cur] -= kv; commCount[cur]--;           // take v out of its community
    if (commCount[cur] === 0) free.push(cur);
    let best = cur, bestGain = (wTo.get(cur) || 0) - gamma * kv * commK[cur] / twoM;
    for (const [c, w] of wTo) {
      if (c === cur) continue;
      const gain = w - gamma * kv * commK[c] / twoM;
      if (gain > bestGain + 1e-12) { best = c; bestGain = gain; }
    }
    if (bestGain < -1e-12) {                      // even the best community is worse than being alone
      let e;
      while ((e = free.pop()) !== undefined && commCount[e] !== 0);
      if (e !== undefined) { best = e; bestGain = 0; }
    }
    commK[best] += kv; commCount[best]++; part[v] = best;
    if (best !== cur) {
      for (const [u] of g.adj[v]) if (part[u] !== best && !inQueue[u]) { inQueue[u] = 1; queue.push(u); }
    }
  }
  return relabel(part);
}

// Phase 2: refinement. Inside each community of `part`, start again from single nodes and merge only nodes
// that are well connected to the community, choosing the target at random with probability growing with the
// gain (temperature theta). This is what guarantees that every final community is connected.
function refine(g, part, gamma, twoM, theta, rng) {
  const n = g.n, eps = 1e-12;
  const refined = Int32Array.from({ length: n }, (_, i) => i);
  const refK = Float64Array.from(g.k), refSize = new Int32Array(n).fill(1);
  const partK = new Float64Array(n);
  for (let i = 0; i < n; i++) partK[part[i]] += g.k[i];
  const ext = new Float64Array(n);                // weight from a refined community to the rest of its community
  for (let v = 0; v < n; v++) for (const [u, w] of g.adj[v]) if (part[u] === part[v]) ext[v] += w;

  for (const v of shuffled(n, rng)) {
    if (refSize[refined[v]] !== 1) continue;      // already part of a bigger refined community
    const S = part[v], kv = g.k[v];
    if (ext[v] < gamma * kv * (partK[S] - kv) / twoM - eps) continue;   // not well connected to its community
    const wTo = new Map();                        // weight from v to each refined community inside S
    for (const [u, w] of g.adj[v]) if (part[u] === S) wTo.set(refined[u], (wTo.get(refined[u]) || 0) + w);
    const options = [{ T: refined[v], gain: 0 }]; // staying alone is always possible
    for (const [T, w] of wTo) {
      if (T === refined[v]) continue;
      if (ext[T] < gamma * refK[T] * (partK[S] - refK[T]) / twoM - eps) continue;   // T not well connected
      const gain = w - gamma * kv * refK[T] / twoM;
      if (gain >= 0) options.push({ T, gain });
    }
    if (options.length === 1) continue;
    const top = Math.max(...options.map(o => o.gain));
    const weights = options.map(o => Math.exp((o.gain - top) / theta));
    let r = rng() * weights.reduce((a, b) => a + b, 0), pick = options[0];
    for (let i = 0; i < options.length; i++) { r -= weights[i]; if (r <= 0) { pick = options[i]; break; } }
    if (pick.T === refined[v]) continue;
    const old = refined[v], T = pick.T;
    ext[T] += ext[old] - 2 * wTo.get(T);          // the edges between v and T are internal from now on
    refK[T] += kv; refSize[T]++; refSize[old] = 0; refined[v] = T;
  }
  return refined;
}

// Phase 3: one node per refined community.
function aggregate(g, refined) {
  const lab = relabel(Int32Array.from(refined)), m = Math.max(...lab) + 1;
  const self = new Float64Array(m), edges = [];
  for (let i = 0; i < g.n; i++) {
    self[lab[i]] += g.self[i];
    for (const [j, w] of g.adj[i]) {
      if (j < i) continue;                        // each edge once
      if (lab[i] === lab[j]) self[lab[i]] += w; else edges.push([lab[i], lab[j], w]);
    }
  }
  return { graph: leidenGraph(m, edges, self), lab, m };
}

// n nodes, edges [[a, b, weight], ...]. Returns the community id of every node.
function leiden(n, edges, { gamma = 1, theta = 0.01, seed = 1, maxLevels = 30 } = {}) {
  const rng = mulberry32(seed);
  let g = leidenGraph(n, edges, new Float64Array(n));
  const twoM = g.k.reduce((a, b) => a + b, 0);
  if (twoM === 0) return Int32Array.from({ length: n }, (_, i) => i);
  const node = Int32Array.from({ length: n }, (_, i) => i);      // original node -> node of the current graph
  let part = Int32Array.from({ length: n }, (_, i) => i);
  for (let level = 0; level < maxLevels; level++) {
    moveNodesFast(g, part, gamma, twoM, rng);
    if (Math.max(...part) + 1 === g.n) break;     // every community is a single node: converged
    const { graph, lab, m } = aggregate(g, refine(g, part, gamma, twoM, theta, rng));
    if (m === g.n) break;                         // refinement merged nothing: stop
    const next = new Int32Array(m);
    for (let i = 0; i < g.n; i++) next[lab[i]] = part[i];        // aggregate nodes start in their old community
    for (let o = 0; o < n; o++) node[o] = lab[node[o]];
    g = graph; part = next;
  }
  return relabel(Int32Array.from(node, c => part[c]));
}

// Lower-case words made of letters (hyphenated words stay in one piece); apostrophes separate words.
function tokenize(text) {
  return text.toLowerCase().match(/[\p{L}\p{M}]+(?:-[\p{L}\p{M}]+)*/gu) || [];
}

// Words worth counting: long enough, not a stop word, not a word of the title, not in `avoid`.
function makeKeep(title, avoid = new Set()) {
  const stop = new Set(((STOPWORDS[WIKI_LANG] || "") + " " + BOILERPLATE).split(/\s+/).filter(Boolean));
  const minLen = STOPWORDS[WIKI_LANG] ? 3 : 4;
  const skip = new Set(EXCLUDE_TITLE_WORDS ? tokenize(title) : []);
  return w => w.length >= minLen && !stop.has(w) && !skip.has(w) && !avoid.has(w);
}
const splitSentences = text => text.replace(/([.!?])\s+/g, "$1\n").split(/\n+/).map(t => t.trim()).filter(Boolean);
const clip = t => (t.length > 160 ? t.slice(0, 157).trimEnd() + "…" : t);
const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
const byCount = (x, y) => y[1] - x[1] || (x[0] < y[0] ? -1 : 1);     // [word, count] pairs: most frequent first

// For each wanted word, an example sentence (a medium-length one if possible, else the first one).
function findExamples(sentences, wanted) {
  const good = new Map(), fallback = new Map();
  for (const sentence of sentences) {
    for (const w of new Set(tokenize(sentence))) {
      if (!wanted.has(w)) continue;
      if (!fallback.has(w)) fallback.set(w, sentence);
      if (!good.has(w) && sentence.length >= 40 && sentence.length <= 220) good.set(w, sentence);
    }
    if (good.size === wanted.size) break;
  }
  return word => good.get(word) || fallback.get(word);
}

// The n most frequent words, each with its count and an example sentence.
function topWords(text, title, n = TOPIC_COUNT, avoid = new Set()) {
  const keep = makeKeep(title, avoid);
  const sentences = splitSentences(text);
  const counts = new Map();
  for (const sentence of sentences)
    for (const w of tokenize(sentence)) if (keep(w)) counts.set(w, (counts.get(w) || 0) + 1);
  const top = [...counts].sort(byCount).slice(0, n);
  const example = findExamples(sentences, new Set(top.map(([word]) => word)));
  return top.map(([word, count]) => {
    const items = [`Appears ${count} time${count === 1 ? "" : "s"} on the page`];
    const ex = example(word);
    if (ex) items.push(`“${clip(ex)}”`);
    return { title: cap(word), items, kind: "Frequent word" };
  });
}

// Topics as groups of related words: link the most frequent words that appear close to each other, let the
// Leiden algorithm find the communities of that graph, and show the n biggest ones (by total occurrences),
// each named after its most frequent word.
function topClusters(text, title, n, avoid = new Set()) {
  const keep = makeKeep(title, avoid);
  const sentences = splitSentences(text);
  const seqs = sentences.map(sentence => tokenize(sentence).filter(keep));
  const counts = new Map();
  for (const seq of seqs) for (const w of seq) counts.set(w, (counts.get(w) || 0) + 1);
  const words = [...counts].filter(([, c]) => c >= 2).sort(byCount).slice(0, CLUSTER_WORDS);   // [word, count]
  if (words.length < 6) return [];                // too little text to find groups
  const index = new Map(words.map(([w], i) => [w, i]));

  const weight = new Map();                       // co-occurrence graph: weight = how often two words are near each other
  for (const seq of seqs) {
    const ids = seq.filter(w => index.has(w)).map(w => index.get(w));
    for (let p = 0; p < ids.length; p++) {
      for (let q = p + 1; q < Math.min(ids.length, p + 1 + CLUSTER_WINDOW); q++) {
        if (ids[p] === ids[q]) continue;
        const key = Math.min(ids[p], ids[q]) * words.length + Math.max(ids[p], ids[q]);
        weight.set(key, (weight.get(key) || 0) + 1);
      }
    }
  }
  const edges = [...weight].map(([key, w]) => [Math.floor(key / words.length), key % words.length, w]);
  // Leiden at the chosen resolution. A group needs 3+ words to count as a real cluster. If fewer than n real
  // clusters come out, try a finer resolution (up to two more times) and keep the attempt with the most.
  const REAL = 3;
  const realCount = groups => [...groups.values()].filter(list => list.length >= REAL).length;
  let groups = null;
  for (let attempt = 0, gamma = CLUSTER_RESOLUTION; attempt < 3; attempt++, gamma *= 1.5) {
    const community = leiden(words.length, edges, { gamma, seed: 1 });
    const candidate = new Map();                  // community id -> its words, already most frequent first
    words.forEach((entry, i) => {
      if (!candidate.has(community[i])) candidate.set(community[i], []);
      candidate.get(community[i]).push(entry);
    });
    if (!groups || realCount(candidate) > realCount(groups)) groups = candidate;
    if (realCount(groups) >= n) break;
  }
  // Real clusters first (biggest total first), then the small leftovers.
  const clusters = [...groups.values()].map(list => ({ list, total: list.reduce((sum, [, c]) => sum + c, 0) }));
  const rank = c => (c.list.length >= REAL ? 1 : 0);
  clusters.sort((a, b) => rank(b) - rank(a) || b.total - a.total || (a.list[0][0] < b.list[0][0] ? -1 : 1));
  const chosen = clusters.slice(0, n);
  const example = findExamples(sentences, new Set(chosen.map(c => c.list[0][0])));

  return chosen.map(c => {
    const label = c.list[0][0];
    const related = c.list.slice(1, 7).map(([w]) => w);
    const items = [];
    if (related.length) items.push(`Related words: ${related.join(", ")}`);
    items.push(`${c.list.length} word${c.list.length === 1 ? "" : "s"}, ${c.total} occurrences`);
    const ex = example(label);
    if (ex) items.push(`“${clip(ex)}”`);
    return { title: cap(label), items, kind: "Topic: group of related words", members: c.list.map(([w]) => w) };
  });
}

// Splits the "== Title ==" text into blocks: the lead first (level 0), then one block per header.
function parseSections(text) {
  const blocks = [{ level: 0, title: "", lines: [] }];
  for (const line of text.split("\n")) {
    const m = line.match(/^(={2,6})\s*(.*?)\s*\1\s*$/);
    if (m) blocks.push({ level: m[1].length, title: m[2], lines: [] });
    else if (line.trim()) blocks[blocks.length - 1].lines.push(line.trim());
  }
  blocks.forEach(b => { b.text = b.lines.join(" "); });
  return blocks;
}

// A medium-length sentence from the text, cut to 160 characters.
function excerptOf(text) {
  const sentences = text.replace(/([.!?])\s+/g, "$1\n").split(/\n+/).map(t => t.trim()).filter(Boolean);
  const pick = sentences.find(t => t.length >= 40) || sentences[0] || "";
  return pick.length > 160 ? pick.slice(0, 157).trimEnd() + "…" : pick;
}

// The first TOPIC_COUNT section headers in page order (no duplicates, no "References" and the like). Only the
// shallowest level counts, so inside a section these are its direct subsections.
function topHeaders(blocks) {
  const skip = new Set(SKIP_HEADERS[WIKI_LANG] || []);
  const seen = new Set(), out = [];
  const depths = blocks.filter(b => b.level >= 2 && b.title).map(b => b.level);
  const top = depths.length ? Math.min(...depths) : 0;      // the shallowest header level: usually 2 for a page, deeper inside a section
  blocks.forEach((b, i) => {
    if (b.level < 2 || b.level < top || b.level > top + HEADER_DEPTH - 1 || !b.title) return;
    const key = b.title.toLowerCase();
    if (skip.has(key) || seen.has(key)) return;
    seen.add(key);
    let text = b.text;                              // the section's own text, else the first text inside its subsections
    for (let j = i + 1; !text && j < blocks.length && blocks[j].level > b.level; j++) text = blocks[j].text;
    out.push({ title: b.title, items: text ? [`“${excerptOf(text)}”`] : [], kind: "Section of the page", isHeader: true });
  });
  return out.slice(0, TOPIC_COUNT);
}

const bodyOf = text => text.split("\n").filter(line => !/^={2,6}.*={2,6}$/.test(line.trim())).join("\n");   // header lines are structure, not content

// Headers first (page order). If there are fewer than TOPIC_COUNT, the rest are topics found by Leiden clustering
// of the page's words (finer and finer until there are enough); if that still leaves gaps, the most frequent words.
function buildTopics(text, title) {
  const headers = topHeaders(parseSections(text));
  if (headers.length >= TOPIC_COUNT) return headers;
  const avoid = new Set(headers.map(h => h.title.toLowerCase()));   // nothing that is already a header
  const body = bodyOf(text);
  let topics = headers;
  const used = new Set(avoid);
  if (USE_LEIDEN) {
    const clusters = topClusters(body, title, TOPIC_COUNT - headers.length, avoid);
    clusters.forEach(cl => used.add(cl.title.toLowerCase()));          // a filler word must not repeat a cluster's name
    topics = headers.concat(clusters);
  }
  if (topics.length < TOPIC_COUNT) topics = topics.concat(topWords(body, title, TOPIC_COUNT - topics.length, used));
  return topics;
}

// Replaces the circles by new ones (same hover mechanism), re-spaces them equally, and fits the map.
function showTopic(title, topics) {
  nodes[0].title = title;
  nodes.length = 1;
  topics.forEach((t, i) => nodes.push({
    id: i + 1, title: t.title, items: t.items, kind: t.kind, isHeader: !!t.isHeader, members: t.members,
    x: 0, y: 0, parent: 0, r: CIRCLE_R, w: 2 * CIRCLE_R, h: 2 * CIRCLE_R,
  }));
  byId.clear();
  nodes.forEach(n => byId.set(n.id, n));
  hovered = null;
  armed = null;
  tip.dataset.node = "";
  layoutRing();
  if (IS_MOBILE) layoutCanvas();                  // the trail may have changed the height of the search bar
  actions.fit();
}

const trailEl = document.getElementById("trail");

// The text of the main node: the whole path ("Paris › History › Roman era"). If it does not fit in 3 lines, the
// oldest steps are dropped from the front ("… › History › Roman era"): the latest choice matters most.
function pathLabel() {
  const labels = levels.map(l => l.label);
  for (let start = 0; start < labels.length; start++) {
    const text = (start ? "… › " : "") + labels.slice(start).join(" › ");
    if (wrapTitle(text, MAIN_MAX_W, 99).length <= MAIN_MAX_LINES) return text;
  }
  return "… › " + labels[labels.length - 1];
}

// Goes back to an earlier step of the path (its topics are restored from memory).
function goToLevel(i) {
  if (searchAbort) searchAbort.abort();
  levels.length = i + 1;
  showLevel();
  qStatus.textContent = "";
}

// The path as small buttons (mobile; on desktop the diagram below does the same). Clicking an earlier step goes back to it.
function renderTrail() {
  trailEl.replaceChildren();
  if (levels.length < 2) return;                  // a single step is just the main node
  levels.forEach((level, i) => {
    if (i > 0) { const sep = document.createElement("span"); sep.textContent = "›"; trailEl.appendChild(sep); }
    const chip = document.createElement("button");
    chip.type = "button";
    chip.textContent = level.label;
    if (i === levels.length - 1) chip.className = "current";
    else chip.addEventListener("click", () => goToLevel(i));
    trailEl.appendChild(chip);
  });
}

// Shows the last level of the path: its label on the main node, its topics around it.
// The path as a diagram: one card per step, first search at the top, each next step nested one notch further in,
// joined by elbow connectors. Cards are marked page / section / word, and clicking an earlier one goes back to it.
const treeList = document.getElementById("treeList");
function renderTree() {
  treeList.replaceChildren();
  const MAX_INDENT = 7;                           // deeper steps stop indenting so the cards stay readable
  levels.forEach((level, i) => {
    const current = i === levels.length - 1;
    const step = document.createElement("li");
    step.className = `step ${level.kind}` + (current ? " current" : "") + (i > MAX_INDENT ? " flat" : "");
    step.style.setProperty("--d", String(Math.min(i, MAX_INDENT)));
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.title = level.anchor ? `${level.page} › ${level.anchor}` : level.page;
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = String(i + 1);
    const text = document.createElement("span");
    text.className = "txt";
    const name = document.createElement("b");
    name.textContent = level.label;
    const meta = document.createElement("small");
    meta.textContent = level.meta;
    text.appendChild(name);
    text.appendChild(meta);
    card.appendChild(badge);
    card.appendChild(text);
    if (current) card.setAttribute("aria-current", "step");
    else card.addEventListener("click", () => goToLevel(i));
    step.appendChild(card);
    treeList.appendChild(step);
  });
  const now = treeList.querySelector(".current");
  if (now && now.scrollIntoView) now.scrollIntoView({ block: "nearest" });
}

function showLevel() {
  renderTrail();
  renderTree();
  const level = levels[levels.length - 1];
  showTopic(pathLabel(), level.topics);
  showWiki(level);
}

/* ---------- 6. THE WIKIPEDIA PAGE OF THE MAIN NODE (panel on the left, under the map on mobile) ---------- */
const wikiHead = document.getElementById("wikiHead");
const wikiBody = document.getElementById("wikiBody");
const pageCache = new Map();                      // page title -> cleaned HTML
let shownPage = null, wikiToken = 0;

const wikiUrl = (page, anchor) => `https://${WIKI_LANG}.wikipedia.org/wiki/${encodeURIComponent(page.replace(/ /g, "_"))}`
                                  + (anchor ? "#" + encodeURIComponent(anchor.replace(/ /g, "_")) : "");

async function fetchPageHtml(page) {
  const data = await wikiApi({ action: "parse", page, prop: "text", formatversion: "2", redirects: "1",
                               disableeditsection: "1", disablelimitreport: "1", disabletoc: "1" });
  if (!data.parse || typeof data.parse.text !== "string") throw new Error("no page text");
  return data.parse.text;
}

// The page's HTML, made safe and tidy: no scripts or styles, no event handlers, no edit links, footnote marks,
// navigation boxes, maps or reference lists; links open on Wikipedia in a new tab; images load lazily.
function cleanWikiHtml(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll(
    "script, style, link, meta, iframe, object, embed, form, input, button, select, textarea, noscript, svg, audio, video, " +
    ".mw-editsection, .mw-kartographer-map, .navbox, .metadata, .noprint, .mw-empty-elt, sup.reference, .mw-cite-backlink, .reflist, .references"
  ).forEach(el => el.remove());
  for (const el of doc.body.querySelectorAll("*")) {
    for (const attr of [...el.attributes]) {
      if (/^on/i.test(attr.name) || attr.name === "style") el.removeAttribute(attr.name);
    }
  }
  for (const a of doc.body.querySelectorAll("a[href]")) {
    let href = a.getAttribute("href");
    if (href.startsWith("//")) href = "https:" + href;
    else if (href.startsWith("/")) href = `https://${WIKI_LANG}.wikipedia.org` + href;
    if (/^https?:/i.test(href) && !a.classList.contains("new")) {      // "new" = a page that does not exist yet (red link)
      a.setAttribute("href", href);
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener noreferrer");
    } else a.removeAttribute("href");                                  // in-page marks, red links, javascript: and so on
  }
  for (const img of doc.body.querySelectorAll("img")) {
    for (const name of ["src", "srcset"]) {
      const value = img.getAttribute(name);
      if (value) img.setAttribute(name, value.replace(/(^|,\s*)\/\//g, "$1https://"));   // "//upload.wikimedia.org/..." -> https
    }
    img.setAttribute("loading", "lazy");
  }
  return doc.body.innerHTML;
}

// Scrolls the panel to a section (and highlights its heading), or back to the top.
function scrollToSection(anchor) {
  wikiBody.querySelectorAll(".focus").forEach(el => el.classList.remove("focus"));
  wikiBody.scrollTop = 0;
  if (!anchor) return;
  const id = anchor.replace(/ /g, "_");
  const target = [...wikiBody.querySelectorAll("[id]")].find(el => el.id === id);
  if (!target) return;
  const heading = target.closest(".mw-heading, h2, h3, h4, h5, h6") || target;
  heading.classList.add("focus");
  wikiBody.scrollTop = heading.getBoundingClientRect().top - wikiBody.getBoundingClientRect().top - 6;
}

async function showWiki(level) {
  const token = ++wikiToken;                      // a newer level replaces an older one still loading
  const { page, anchor } = level;
  wikiHead.replaceChildren();
  const title = document.createElement("strong");
  title.textContent = anchor ? `${page} › ${anchor}` : page;
  const link = document.createElement("a");
  link.href = wikiUrl(page, anchor);
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "Open on Wikipedia ↗";
  wikiHead.appendChild(title);
  wikiHead.appendChild(link);
  if (shownPage === page) { scrollToSection(anchor); return; }          // same page: only move to the section
  wikiBody.textContent = "Loading the page…";
  shownPage = null;
  try {
    let html = pageCache.get(page);
    if (!html) { html = cleanWikiHtml(await fetchPageHtml(page)); pageCache.set(page, html); }
    if (token !== wikiToken) return;
    wikiBody.innerHTML = html;                    // safe: cleaned above
    shownPage = page;
    scrollToSection(anchor);
  } catch (err) {
    if (token === wikiToken) wikiBody.textContent = "The page could not be loaded here: use “Open on Wikipedia” above.";
  }
}

async function search(query) {
  query = query.trim();
  if (!query) return;
  if (searchAbort) searchAbort.abort();           // a newer search replaces an older one still running
  searchAbort = new AbortController();
  const signal = searchAbort.signal;
  qStatus.textContent = "Searching…";
  try {
    const title = await findWikipediaTitle(query, signal);
    if (!title) { qStatus.textContent = `No Wikipedia page found for “${query}”`; return; }
    qStatus.textContent = "Reading the page…";
    const text = await fetchPlainText(title, signal);
    const topics = buildTopics(text, title);
    levels = [{ label: title, page: title, text, topics, anchor: null, kind: "page", meta: "Wikipedia page" }];   // a new search starts a new path
    showLevel();
    qStatus.textContent = topics.length ? "" : "This page has too little text to find topics";
  } catch (err) {
    if (err.name !== "AbortError") qStatus.textContent = "Search failed: check your connection and try again";
  }
}

// The text of a section: its own lines, then its subsections (with their "=== Title ===" markers).
function sectionText(blocks, index) {
  const b = blocks[index], out = [...b.lines];
  for (let j = index + 1; j < blocks.length && blocks[j].level > b.level; j++) {
    const marks = "=".repeat(blocks[j].level);
    out.push(`${marks} ${blocks[j].title} ${marks}`, ...blocks[j].lines);
  }
  return out.join("\n");
}

// Going deeper inside the current page when no page of its own exists for the idea. A section gives its text
// (so its subsections become the new circles, then frequent words of its text); a word or topic gives the
// sentences that mention it.
function drillInPage(parent, node, pathText) {
  let text = "";
  if (node.isHeader) {
    const blocks = parseSections(parent.text);
    const i = blocks.findIndex(b => b.level >= 2 && b.title === node.title);
    if (i >= 0) text = sectionText(blocks, i);
  } else {
    const members = new Set(node.members || [node.title.toLowerCase()]);
    text = splitSentences(bodyOf(parent.text)).filter(sentence => tokenize(sentence).some(w => members.has(w))).join("\n");
  }
  return { text, topics: text ? buildTopics(text, pathText) : [] };
}

// Goes one level deeper into a circle. The main node becomes the whole path ("Paris › History › …"), and the new
// circles come from the same algorithm as for a search: the sections, then frequent words if there are fewer than 8.
// The text comes from a Wikipedia page of its own for "<current page> + <idea>" if there is one ("History of
// Paris"), otherwise from inside the current page. Where the circles are only frequent words, the page is
// looked up from the last two terms alone (the previous term of the path + the clicked word). Siblings stay independent: only the clicked idea is added.
async function descend(node) {
  if (!levels.length) return;
  if (searchAbort) searchAbort.abort();
  searchAbort = new AbortController();
  const signal = searchAbort.signal;
  const parent = levels[levels.length - 1];
  const pathText = [...levels.map(l => l.label), node.title].join(" ");
  qStatus.textContent = `Opening “${node.title}”…`;
  try {
    let page = parent.page, text = "", topics = [], note = "";
    // Usually the article is looked up from the current page and the clicked idea ("History of Paris" + "Roman era").
    // When the circles here are only frequent words (a page without sections), it depends on the last two terms
    // alone: the previous term of the path and the clicked word.
    const onlyWords = parent.topics.length > 0 && parent.topics.every(t => !t.isHeader);
    const base = onlyWords ? parent.label : parent.page;
    const related = await findRelatedPage(base, node.title, new Set(levels.map(l => l.page)), signal);
    if (related) {
      qStatus.textContent = "Reading the page…";
      const relatedText = await fetchPlainText(related, signal);
      const relatedTopics = buildTopics(relatedText, pathText);
      if (relatedTopics.length) {
        page = related; text = relatedText; topics = relatedTopics;
        note = `Wikipedia page: “${related}”` + (onlyWords ? ` (found from “${base}” + “${node.title}”)` : "");
      }
    }
    if (!topics.length) {
      ({ text, topics } = drillInPage(parent, node, pathText));
      note = node.isHeader ? `Inside the section “${node.title}” of “${parent.page}”`
                           : `Sentences of “${parent.page}” about “${node.title}”`;
    }
    if (!topics.length) { qStatus.textContent = `Nothing more to show for “${node.title}”`; return; }
    // Where to scroll the Wikipedia panel: the clicked section if we stayed inside the page, otherwise the top.
    const anchor = related && page === related ? null : node.isHeader ? node.title : parent.anchor;
    const kind = page !== parent.page ? "page" : node.isHeader ? "section" : "word";   // where its content comes from
    const meta = kind === "page" ? `Page: ${page}` : kind === "section" ? `Section of ${parent.page}` : `Word in ${parent.page}`;
    levels.push({ label: node.title, page, text, topics, anchor, kind, meta });
    showLevel();
    qStatus.textContent = note;
  } catch (err) {
    if (err.name !== "AbortError") qStatus.textContent = "Could not open it: check your connection and try again";
  }
}
qInput.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) return search(qInput.value); });

layoutRing();
layoutCanvas();
actions.fit();
draw();
</script>
